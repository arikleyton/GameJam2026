<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Spear Rush</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; background: #0b0a10; overflow: hidden; }
    #game { width: 100%; height: 100%; }
    canvas { display: block; }
    /* navbar temporária de dev — remover antes de publicar (ver src/devnav.js) */
    #devnav {
      position: fixed; top: 6px; left: 6px; z-index: 1000;
      display: flex; gap: 4px; flex-wrap: wrap; align-items: center;
      background: rgba(8,6,14,0.75); border: 1px solid #6d1f2b; border-radius: 4px;
      padding: 4px 6px; font-family: monospace; font-size: 11px;
    }
    #devnav span { color: #ff5577; font-weight: bold; margin-right: 2px; }
    #devnav button {
      font-family: monospace; font-size: 11px; cursor: pointer;
      background: #2b2438; color: #e8e4f0; border: 1px solid #6d6788; border-radius: 3px; padding: 2px 6px;
    }
    #devnav button:hover { background: #3a3050; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="devnav">
    <span>DEV</span>
    <button data-mode="Menu">Menu</button>
    <button data-mode="tutorial">Treino</button>
    <button data-mode="boss" data-boss="0">Boss 1</button>
    <button data-mode="boss" data-boss="1">Boss 2</button>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script>
    // fase de dev: carrega os arquivos do jogo sempre frescos (sem cache do navegador),
    // porque em desenvolvimento o navegador às vezes guarda uma versão antiga e some com as mudanças.
    // remover isso e voltar pras tags <script> normais quando o jogo for publicado.
    (function () {
      var v = Date.now();
      ['src/config.js', 'src/bosses.js', 'src/scenes.js', 'src/game.js', 'src/main.js', 'src/devnav.js']
        .forEach(function (f) { document.write('<script src="' + f + '?v=' + v + '"><' + '/script>'); });
    })();
  </script>
</body>
</html>
