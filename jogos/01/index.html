<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Block Busters - Jogo Arcade Pixel Art</title>
    <!-- Google Pixel Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <!-- Phaser 3 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #03050d;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(124, 58, 237, 0.25) 0%, transparent 60%),
                radial-gradient(circle at 20% 80%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(236, 72, 153, 0.15) 0%, transparent 50%);
            color: #f8fafc;
            font-family: 'Press Start 2P', monospace;
            overflow-x: hidden;
            touch-action: manipulation;
            user-select: none;
            min-height: 100vh;
        }

        /* Estrutura Externa do Gabinete de Fliperama */
        .arcade-cabinet {
            background: linear-gradient(180deg, #1e1b4b 0%, #0f172a 40%, #020617 100%);
            border: 6px solid #312e81;
            border-bottom: none;
            border-radius: 28px 28px 0 0;
            box-shadow: 
                0 0 50px rgba(99, 102, 241, 0.35),
                0 20px 50px rgba(0, 0, 0, 0.9),
                inset 0 2px 10px rgba(255, 255, 255, 0.2);
            position: relative;
            max-width: 900px;
            width: 96%;
            margin: 15px auto 0 auto;
        }

        /* Marquee / Letreiro Luminoso do Topo */
        .arcade-marquee {
            background: linear-gradient(180deg, #facc15 0%, #ca8a04 40%, #854d0e 100%);
            border: 4px solid #1e1b4b;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(250, 204, 21, 0.6), inset 0 0 15px rgba(255, 255, 255, 0.8);
            position: relative;
            overflow: hidden;
        }

        .marquee-glow {
            animation: pulse-glow 2s infinite alternate;
        }

        @keyframes pulse-glow {
            0% { text-shadow: 0 0 10px #fde047, 0 0 20px #eab308; }
            100% { text-shadow: 0 0 20px #fde047, 0 0 35px #ca8a04, 0 0 50px #eab308; }
        }

        /* Moldura Bezel do Monitor CRT */
        .arcade-bezel {
            background: linear-gradient(180deg, #090d16 0%, #111827 100%);
            border: 14px solid #1f2937;
            border-radius: 16px;
            box-shadow: 
                inset 0 0 30px rgba(0, 0, 0, 0.95),
                0 0 15px rgba(0, 0, 0, 0.8),
                0 0 2px #4b5563;
            position: relative;
        }

        #game-container {
            width: 100%;
            max-width: 800px;
            aspect-ratio: 4/3;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* Efeito Retrô CRT Scanlines & Reflexo do Vidro */
        .crt-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            border-radius: 8px;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.3) 50%
            ), linear-gradient(
                90deg,
                rgba(255, 0, 0, 0.03),
                rgba(0, 255, 0, 0.01),
                rgba(0, 0, 255, 0.03)
            );
            background-size: 100% 4px, 6px 100%;
            box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.85);
            z-index: 10;
        }

        .crt-glass-glare {
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 40%, transparent 40.1%);
            pointer-events: none;
            z-index: 11;
        }

        /* Painel de Controle (Deck) de Fliperama */
        .control-deck {
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            border-top: 6px solid #334155;
            border-bottom: 8px solid #020617;
            box-shadow: inset 0 5px 15px rgba(255,255,255,0.05);
        }

        /* Botões Arcade 3D */
        .arcade-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            box-shadow: 0 6px 0 var(--btn-shadow), 0 8px 10px rgba(0,0,0,0.5);
            transition: transform 0.05s ease, box-shadow 0.05s ease;
            cursor: pointer;
        }
        .arcade-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 var(--btn-shadow), 0 3px 6px rgba(0,0,0,0.5);
        }

        .btn-red { background: radial-gradient(circle, #ef4444 30%, #b91c1c 90%); --btn-shadow: #7f1d1d; color: #fff; }
        .btn-blue { background: radial-gradient(circle, #3b82f6 30%, #1d4ed8 90%); --btn-shadow: #1e3a8a; color: #fff; }
        .btn-yellow { background: radial-gradient(circle, #facc15 30%, #ca8a04 90%); --btn-shadow: #713f12; color: #000; }
        .btn-green { background: radial-gradient(circle, #22c55e 30%, #15803d 90%); --btn-shadow: #14532d; color: #fff; }

        /* Joystick Visual */
        .joystick-base {
            width: 70px;
            height: 70px;
            background: radial-gradient(circle, #334155 0%, #0f172a 80%);
            border: 4px solid #475569;
            border-radius: 50%;
            box-shadow: inset 0 0 10px #000, 0 4px 8px rgba(0,0,0,0.6);
            position: relative;
        }
        .joystick-stick {
            width: 14px;
            height: 38px;
            background: linear-gradient(90deg, #94a3b8 0%, #cbd5e1 50%, #64748b 100%);
            position: absolute;
            top: 6px;
            left: 24px;
            border-radius: 4px;
            transform-origin: bottom center;
        }
        .joystick-ball {
            width: 36px;
            height: 36px;
            background: radial-gradient(circle at 35% 35%, #f87171 0%, #dc2626 50%, #7f1d1d 100%);
            border-radius: 50%;
            position: absolute;
            top: -20px;
            left: -11px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.7), inset -2px -2px 6px rgba(0,0,0,0.6);
        }

        /* Insert Coin Slot */
        .coin-slot-btn {
            background: linear-gradient(180deg, #ef4444 0%, #991b1b 100%);
            border: 2px solid #fca5a5;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.7), inset 0 0 6px rgba(255,255,255,0.5);
            animation: pulse-coin 1.5s infinite alternate;
        }
        @keyframes pulse-coin {
            0% { box-shadow: 0 0 6px rgba(239, 68, 68, 0.5); }
            100% { box-shadow: 0 0 18px rgba(239, 68, 68, 0.9); }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-start min-h-screen m-0 p-2 sm:p-4">

    <!-- Gabinete Arcade Completo (Fliperama) -->
    <div class="arcade-cabinet flex flex-col items-center justify-between p-3 sm:p-5">
        
        <!-- Topo Marquee Luminoso -->
        <div class="arcade-marquee w-full py-3 px-4 mb-3 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="inline-block w-3 h-3 rounded-full bg-red-500 animate-ping"></span>
                <button id="sound-toggle-btn" class="bg-amber-950/80 hover:bg-amber-900 text-yellow-300 text-[9px] sm:text-[10px] font-bold px-2 py-1 rounded border border-amber-500/60 transition-all active:scale-95 cursor-pointer flex items-center gap-1">
                    <span id="sound-icon">🔊</span> <span id="sound-text">SOM: ON</span>
                </button>
            </div>
            
            <div class="text-center">
                <h1 class="marquee-glow text-base sm:text-2xl font-black tracking-wider text-slate-900 uppercase">
                    ★ BLOCK BUSTERS ★
                </h1>
            </div>

            <div class="bg-black/60 px-3 py-1 rounded border border-amber-400/50">
                <span id="credit-count" class="text-[10px] sm:text-xs text-yellow-400 font-mono tracking-widest">CREDIT 01</span>
            </div>
        </div>

        <!-- Grade dos Alto-Falantes Laterais (Speakers) -->
        <div class="w-full flex justify-between items-center px-4 mb-2 text-slate-600 text-[9px]">
            <div class="flex gap-1">
                <div class="w-2 h-4 bg-slate-800 rounded-sm border border-slate-700"></div>
                <div class="w-2 h-4 bg-slate-800 rounded-sm border border-slate-700"></div>
                <div class="w-2 h-4 bg-slate-800 rounded-sm border border-slate-700"></div>
            </div>
            <span class="text-slate-400 text-[10px] tracking-widest uppercase">HI-FI STEREO SOUND</span>
            <div class="flex gap-1">
                <div class="w-2 h-4 bg-slate-800 rounded-sm border border-slate-700"></div>
                <div class="w-2 h-4 bg-slate-800 rounded-sm border border-slate-700"></div>
                <div class="w-2 h-4 bg-slate-800 rounded-sm border border-slate-700"></div>
            </div>
        </div>

        <!-- Moldura Bezel do Monitor CRT -->
        <div class="arcade-bezel w-full flex flex-col items-center justify-center p-2 sm:p-4">
            
            <!-- Tela do Jogo -->
            <div id="game-container">
                <div class="crt-overlay"></div>
                <div class="crt-glass-glare"></div>
            </div>

            <!-- Rodapé do Monitor com Selos Arcade -->
            <div class="w-full flex justify-between items-center px-2 mt-2 text-[9px] text-slate-400">
                <span>INSERT COIN TO PLAY</span>
                <span id="mode-display-bezel" class="text-amber-400 font-bold">1 OR 2 PLAYERS</span>
                <span>CRT COLOR MONITOR</span>
            </div>
        </div>

        <!-- Painel de Controle (Deck Arcade) -->
        <div class="control-deck w-full mt-3 p-3 sm:p-4 rounded-xl flex flex-wrap items-center justify-around gap-4">
            
            <!-- Joystick Decorativo -->
            <div class="flex flex-col items-center gap-1">
                <div class="joystick-base flex items-center justify-center">
                    <div class="joystick-stick">
                        <div class="joystick-ball"></div>
                    </div>
                </div>
                <span class="text-[9px] text-slate-400 uppercase tracking-wider">MOVE</span>
            </div>

            <!-- Slot de Moeda / Ficha Interativo -->
            <div class="flex flex-col items-center gap-1">
                <button id="coin-btn" class="coin-slot-btn px-3 py-2 rounded flex flex-col items-center justify-center cursor-pointer active:scale-95 transition-transform" title="Clique para inserir moeda!">
                    <span class="text-[9px] text-white font-bold">25¢</span>
                    <div class="w-6 h-1 bg-black my-1 rounded-full"></div>
                    <span class="text-[7px] text-red-200">PUSH COIN</span>
                </button>
                <span class="text-[8px] text-amber-400 uppercase tracking-wider">INSERT COIN</span>
            </div>

            <!-- Botões de Ação Arcade -->
            <div class="flex flex-col items-center gap-1">
                <div class="grid grid-cols-3 gap-2">
                    <div class="arcade-btn btn-red">A</div>
                    <div class="arcade-btn btn-blue">B</div>
                    <div class="arcade-btn btn-yellow">C</div>
                    <div class="arcade-btn btn-green">X</div>
                    <div class="arcade-btn btn-red">Y</div>
                    <div class="arcade-btn btn-blue">Z</div>
                </div>
                <span class="text-[9px] text-slate-400 uppercase tracking-wider">ACTION</span>
            </div>
        </div>

    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const coinBtn = document.getElementById('coin-btn');
        const creditCount = document.getElementById('credit-count');
        const soundBtn = document.getElementById('sound-toggle-btn');
        const soundIcon = document.getElementById('sound-icon');
        const soundText = document.getElementById('sound-text');
        let credits = 1;

        if (coinBtn) {
            coinBtn.addEventListener('click', () => {
                credits++;
                if (creditCount) {
                    creditCount.textContent = `CREDIT ${credits < 10 ? '0' + credits : credits}`;
                }
                if (window.audioSystem) {
                    window.audioSystem.playSFX('correct');
                }
            });
        }

        if (soundBtn) {
            soundBtn.addEventListener('click', () => {
                if (window.audioSystem) {
                    const isMuted = window.audioSystem.toggleMute();
                    soundIcon.textContent = isMuted ? '🔇' : '🔊';
                    soundText.textContent = isMuted ? 'SOM: OFF' : 'SOM: ON';
                }
            });
        }
    });

    class LoFiAudioSystem {
        constructor() {
            this.ctx = null;
            this.masterGain = null;
            this.isPlaying = false;
            this.isMuted = false;
            this.timer = null;
            this.step = 0;
            this.isDanger = false;
            this.tempo = 132;

            this.melodyNormal = [
                523.25, 659.25, 783.99, 1046.50, 783.99, 659.25, 880.00, 1046.50,
                587.33, 698.46, 880.00, 1174.66, 880.00, 698.46, 783.99, 1046.50,
                523.25, 659.25, 783.99, 1046.50, 987.77, 783.99, 659.25, 587.33,
                523.25, 587.33, 659.25, 783.99, 880.00, 987.77, 1046.50, 0
            ];

            this.bassNormal = [
                130.81, 130.81, 261.63, 130.81, 110.00, 110.00, 220.00, 110.00,
                146.83, 146.83, 293.66, 146.83, 196.00, 196.00, 392.00, 196.00,
                130.81, 130.81, 261.63, 130.81, 110.00, 110.00, 220.00, 110.00,
                174.61, 174.61, 349.23, 174.61, 196.00, 196.00, 392.00, 196.00
            ];

            this.melodyDanger = [
                587.33, 622.25, 587.33, 466.16, 587.33, 622.25, 698.46, 622.25,
                587.33, 622.25, 587.33, 466.16, 440.00, 466.16, 523.25, 466.16,
                587.33, 783.99, 698.46, 622.25, 587.33, 622.25, 698.46, 880.00,
                932.33, 880.00, 783.99, 698.46, 622.25, 587.33, 466.16, 0
            ];

            this.bassDanger = [
                146.83, 146.83, 146.83, 293.66, 146.83, 146.83, 146.83, 293.66,
                116.54, 116.54, 116.54, 233.08, 130.81, 130.81, 130.81, 261.63,
                146.83, 146.83, 146.83, 293.66, 174.61, 174.61, 174.61, 349.23,
                196.00, 196.00, 196.00, 392.00, 146.83, 146.83, 293.66, 146.83
            ];
        }

        init() {
            if (!this.ctx) {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioCtx();
                this.masterGain = this.ctx.createGain();
                this.masterGain.gain.setValueAtTime(0.35, this.ctx.currentTime);
                this.masterGain.connect(this.ctx.destination);
            }
            if (this.ctx.state === 'suspended') {
                this.ctx.resume();
            }
        }

        toggleMute() {
            this.init();
            this.isMuted = !this.isMuted;
            if (this.masterGain) {
                this.masterGain.gain.setValueAtTime(this.isMuted ? 0 : 0.35, this.ctx.currentTime);
            }
            return this.isMuted;
        }

        setDangerMode(danger) {
            this.isDanger = danger;
        }

        startMusic() {
            this.init();
            if (this.isPlaying) return;
            this.isPlaying = true;

            const stepDuration = (60 / this.tempo) / 4;

            const playStep = () => {
                if (!this.isPlaying || !this.ctx) return;
                const now = this.ctx.currentTime;
                const isDanger = this.isDanger;

                const melodyArr = isDanger ? this.melodyDanger : this.melodyNormal;
                const bassArr = isDanger ? this.bassDanger : this.bassNormal;

                const stepIdx = this.step % 32;

                const melFreq = melodyArr[stepIdx];
                if (melFreq > 0) {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    const filter = this.ctx.createBiquadFilter();

                    osc.type = 'square';
                    osc.frequency.setValueAtTime(melFreq, now);

                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(isDanger ? 2400 : 2000, now);

                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + stepDuration * 1.2);

                    osc.connect(filter);
                    filter.connect(gain);
                    gain.connect(this.masterGain);

                    osc.start(now);
                    osc.stop(now + stepDuration * 1.3);
                }

                const bassFreq = bassArr[stepIdx];
                if (bassFreq > 0) {
                    const bOsc = this.ctx.createOscillator();
                    const bGain = this.ctx.createGain();
                    const bFilter = this.ctx.createBiquadFilter();

                    bOsc.type = 'sawtooth';
                    bOsc.frequency.setValueAtTime(bassFreq, now);

                    bFilter.type = 'lowpass';
                    bFilter.frequency.setValueAtTime(650, now);
                    bFilter.frequency.exponentialRampToValueAtTime(180, now + stepDuration);

                    bGain.gain.setValueAtTime(0.18, now);
                    bGain.gain.exponentialRampToValueAtTime(0.001, now + stepDuration * 1.5);

                    bOsc.connect(bFilter);
                    bFilter.connect(bGain);
                    bGain.connect(this.masterGain);

                    bOsc.start(now);
                    bOsc.stop(now + stepDuration * 1.6);
                }

                if (stepIdx % 4 === 0) {
                    const kOsc = this.ctx.createOscillator();
                    const kGain = this.ctx.createGain();
                    kOsc.type = 'sine';
                    kOsc.frequency.setValueAtTime(150, now);
                    kOsc.frequency.exponentialRampToValueAtTime(35, now + 0.08);

                    kGain.gain.setValueAtTime(0.25, now);
                    kGain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);

                    kOsc.connect(kGain);
                    kGain.connect(this.masterGain);
                    kOsc.start(now);
                    kOsc.stop(now + 0.1);
                } else if (stepIdx % 4 === 2) {
                    const sOsc = this.ctx.createOscillator();
                    const sGain = this.ctx.createGain();
                    sOsc.type = 'triangle';
                    sOsc.frequency.setValueAtTime(240, now);
                    sOsc.frequency.exponentialRampToValueAtTime(80, now + 0.06);

                    sGain.gain.setValueAtTime(0.15, now);
                    sGain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);

                    sOsc.connect(sGain);
                    sGain.connect(this.masterGain);
                    sOsc.start(now);
                    sOsc.stop(now + 0.08);
                }

                this.step++;
            };

            playStep();
            if (this.timer) clearInterval(this.timer);
            this.timer = setInterval(playStep, stepDuration * 1000);
        }

        playSFX(type) {
            this.init();
            if (!this.ctx || this.isMuted) return;
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();

            osc.connect(gain);
            gain.connect(this.masterGain);

            if (type === 'correct') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.08);
                osc.frequency.setValueAtTime(783.99, now + 0.16);
                osc.frequency.setValueAtTime(1046.50, now + 0.24);
                gain.gain.setValueAtTime(0.22, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
                osc.start(now);
                osc.stop(now + 0.38);
            } else if (type === 'error') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.linearRampToValueAtTime(90, now + 0.25);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'hit') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(280, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.35);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                osc.start(now);
                osc.stop(now + 0.35);
            } else if (type === 'click') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(587.33, now);
                gain.gain.setValueAtTime(0.18, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            }
        }
    }

    const audioSystem = new LoFiAudioSystem();

    class BootScene extends Phaser.Scene {
        constructor() {
            super({ key: 'BootScene' });
        }

        create() {
            this.generateBackgrounds();
            this.generatePlayerSkins();
            this.generateShapeTextures();
            this.generateEnemyTexture();
            this.generateParticleTexture();
            this.generatePixelTitleBanner();

            this.scene.start('StartScene');
        }

        generatePixelTitleBanner() {
            let c = this.textures.createCanvas('pixel_logo', 400, 80);
            let ctx = c.context;
            
            ctx.fillStyle = '#1e1b4b'; ctx.fillRect(0, 0, 400, 80);
            ctx.fillStyle = '#4338ca'; ctx.fillRect(4, 4, 392, 72);
            ctx.fillStyle = '#312e81'; ctx.fillRect(8, 8, 384, 64);

            ctx.fillStyle = '#fbbf24';
            ctx.fillRect(12, 12, 8, 8); ctx.fillRect(380, 12, 8, 8);
            ctx.fillRect(12, 60, 8, 8); ctx.fillRect(380, 60, 8, 8);

            c.refresh();
        }

        generateBackgrounds() {
            let c = this.textures.createCanvas('bg_day', 800, 600);
            let ctx = c.context;
            
            let grad = ctx.createLinearGradient(0, 0, 0, 600);
            grad.addColorStop(0, '#1e3a8a');
            grad.addColorStop(0.5, '#2563eb');
            grad.addColorStop(1, '#60a5fa');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 800, 600);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
            for (let y = 0; y < 600; y += 8) {
                for (let x = (y % 16 === 0 ? 0 : 4); x < 800; x += 8) {
                    ctx.fillRect(x, y, 4, 4);
                }
            }

            const drawPixelCloud = (cx, cy, scale) => {
                ctx.fillStyle = '#1d4ed8';
                ctx.fillRect(cx - 24*scale, cy + 12*scale, 96*scale, 24*scale);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(cx - 20*scale, cy + 4*scale, 88*scale, 24*scale);
                ctx.fillRect(cx - 12*scale, cy - 8*scale, 64*scale, 28*scale);
                ctx.fillRect(cx + 8*scale, cy - 20*scale, 32*scale, 36*scale);
                ctx.fillStyle = '#dbeafe';
                ctx.fillRect(cx - 8*scale, cy - 4*scale, 24*scale, 12*scale);
            };

    class GameScene extends Phaser.Scene {
        constructor() {
            super({ key: 'GameScene' });
        }

        init(data) {
            this.gameMode = (data && data.mode) ? data.mode : 'solo';
            this.level = 1;
            // Início com 1 minuto completo (60 segundos)
            this.timeLeft = 60;
            this.p1Score = 0;
            this.p2Score = 0;
            this.maxHP = 100;
            this.p1HP = 100;
            this.p2HP = 100;
            this.isGameOver = false;
            this.mobileDir = { x: 0, y: 0 };
            this.enemy = null;
            this.p1HitCooldown = false;
            this.p2HitCooldown = false;

            // Estados de vida para eliminação e mecânica de reviver
            this.p1Dead = false;
            this.p2Dead = false;

            this.bgThemes = ['bg_day', 'bg_sunset', 'bg_night', 'bg_pastel'];
            this.playerSkins = ['player_slime', 'player_cat', 'player_bot', 'player_alien', 'player_star', 'player_ghost'];
            this.shapeTypes = ['shape_square', 'shape_circle', 'shape_diamond', 'shape_triangle', 'shape_star', 'shape_hexagon'];
        }

        create() {
            this.bgImage = this.add.image(400, 300, 'bg_day');

            this.physics.world.setBounds(0, 75, 800, 525);

            this.objectsGroup = this.physics.add.group({
                bounceX: 1,
                bounceY: 1,
                collideWorldBounds: true
            });

            this.physics.add.collider(this.objectsGroup, this.objectsGroup);

            this.player1 = this.physics.add.sprite(this.gameMode === 'duo' ? 350 : 400, 330, 'player_slime');
            this.player1.setCollideWorldBounds(true);
            this.player1.body.setSize(26, 26);

            this.p1Label = this.add.text(this.player1.x, this.player1.y - 24, 'P1', {
                fontFamily: '"Press Start 2P", monospace',
                fontSize: '9px',
                color: '#38bdf8',
                stroke: '#000000',
                strokeThickness: 3
            }).setOrigin(0.5);

            if (this.gameMode === 'duo') {
                this.player2 = this.physics.add.sprite(450, 330, 'player_cat');
                this.player2.setCollideWorldBounds(true);
                this.player2.body.setSize(26, 26);

                this.p2Label = this.add.text(this.player2.x, this.player2.y - 24, 'P2', {
                    fontFamily: '"Press Start 2P", monospace',
                    fontSize: '9px',
                    color: '#f472b6',
                    stroke: '#000000',
                    strokeThickness: 3
                }).setOrigin(0.5);

                this.physics.add.collider(this.player1, this.player2);
            } else {
                this.player2 = null;
                this.p2Label = null;
            }

            this.cursors = this.input.keyboard.createCursorKeys();
            this.wasd = this.input.keyboard.addKeys({
                up: Phaser.Input.Keyboard.KeyCodes.W,
                down: Phaser.Input.Keyboard.KeyCodes.S,
                left: Phaser.Input.Keyboard.KeyCodes.A,
                right: Phaser.Input.Keyboard.KeyCodes.D
            });

            this.emitter = this.add.particles(0, 0, 'starParticle', {
                speed: { min: 120, max: 280 },
                scale: { start: 1.8, end: 0 },
                lifespan: 500,
                blendMode: 'ADD',
                emitting: false
            });

            this.createHUD();
            this.createVirtualControls();
            this.setupLevel();

            this.time.addEvent({
                delay: 1000,
                callback: this.updateTimer,
                callbackScope: this,
                loop: true
            });
        }

        createHUD() {
            const hudBg = this.add.graphics();
            hudBg.fillStyle(0x0f172a, 0.96);
            hudBg.fillRect(0, 0, 800, 72);
            hudBg.lineStyle(3, 0x3b82f6, 1);
            hudBg.lineBetween(0, 72, 800, 72);

            const modeBadge = this.gameMode === 'duo' ? '👥 MODO DUO (2P)' : '⏱️ UM MINUTO (SOLO)';

            this.levelText = this.add.text(16, 14, `FASE: ${this.level}`, {
                fontFamily: '"Press Start 2P", monospace',
                fontSize: '11px',
                color: '#38bdf8'
            });

            this.modeBadgeText = this.add.text(16, 38, modeBadge, {
                fontFamily: '"Press Start 2P", monospace',
                fontSize: '8px',
                color: this.gameMode === 'duo' ? '#c084fc' : '#a7f3d0'
            });

            // TABELA DO PLACAR E BARRAS DE VIDA NO CENTRO DO HUD
            const tableBox = this.add.graphics();
            tableBox.fillStyle(0x1e293b, 1);
            tableBox.fillRect(160, 4, 300, 64);
            tableBox.lineStyle(2, 0xfacc15, 1);
            tableBox.strokeRect(160, 4, 300, 64);

            // Cabeçalho da Tabela
            tableBox.fillStyle(0x020617, 1);
            tableBox.fillRect(162, 6, 296, 16);
            tableBox.lineStyle(1, 0x475569, 1);
            tableBox.lineBetween(160, 22, 460, 22);
            tableBox.lineBetween(310, 22, 310, 68); // Divisória vertical P1 | P2

            this.add.text(310, 14, '📊 PEÇAS & VIDA (HP)', {
                fontFamily: '"Press Start 2P", monospace',
                fontSize: '8px',
                color: '#fde047'
            }).setOrigin(0.5);

            // Células P1 e P2
            this.p1ScoreCellText = this.add.text(235, 30, `👤 P1: 0`, {
                fontFamily: '"Press Start 2P", monospace',
                fontSize: '8px',
                color: '#38bdf8'
            }).setOrigin(0.5);

            this.p2ScoreCellText = this.add.text(385, 30, this.gameMode === 'duo' ? `👥 P2: 0` : `🤖 SOLO`, {
                fontFamily: '"Press Start 2P", monospace',
                fontSize: '8px',
                color: '#f472b6'
            }).setOrigin(0.5);

            this.hpBarGraphics = this.add.graphics();

            this.tableLeaderText = this.add.text(310, 58, 'EMPATE', {
                fontFamily: '"Press Start 2P", monospace',
                fontSize: '7px',
                color: '#94a3b8'
            }).setOrigin(0.5);

            // Temporizador no lado direito
            this.timeText = this.add.text(485, 16, `TEMPO: ${this.timeLeft}s`, {
                fontFamily: '"Press Start 2P", monospace',
                fontSize: '12px',
                color: '#facc15'
            });

            this.timerBarBg = this.add.graphics();
            this.timerBarBg.fillStyle(0x334155, 1);
            this.timerBarBg.fillRect(485, 40, 295, 18);
            this.timerBarBg.lineStyle(2, 0x64748b, 1);
            this.timerBarBg.strokeRect(485, 40, 295, 18);

            this.timerBar = this.add.graphics();
            this.updateTimerBar();
            this.updateScoreTable();
            this.updateHPBars();
        }

        updateHPBars() {
            if (!this.hpBarGraphics) return;
            this.hpBarGraphics.clear();

            // Barra HP P1
            const p1Pct = Math.max(0, this.p1HP / this.maxHP);
            let p1Color = 0x22c55e;
            if (p1Pct <= 0.5) p1Color = 0xeab308;
            if (p1Pct <= 0.25) p1Color = 0xef4444;

            this.hpBarGraphics.fillStyle(0x0f172a, 1);
            this.hpBarGraphics.fillRect(175, 41, 120, 10);
            this.hpBarGraphics.lineStyle(1, 0x475569, 1);
            this.hpBarGraphics.strokeRect(175, 41, 120, 10);

            this.hpBarGraphics.fillStyle(p1Color, 1);
            this.hpBarGraphics.fillRect(176, 42, Math.max(0, 118 * p1Pct), 8);

            // Barra HP P2
            if (this.gameMode === 'duo') {
                const p2Pct = Math.max(0, this.p2HP / this.maxHP);
                let p2Color = 0x22c55e;
                if (p2Pct <= 0.5) p2Color = 0xeab308;
                if (p2Pct <= 0.25) p2Color = 0xef4444;

                this.hpBarGraphics.fillStyle(0x0f172a, 1);
                this.hpBarGraphics.fillRect(325, 41, 120, 10);
                this.hpBarGraphics.lineStyle(1, 0x475569, 1);
                this.hpBarGraphics.strokeRect(325, 41, 120, 10);

                this.hpBarGraphics.fillStyle(p2Color, 1);
                this.hpBarGraphics.fillRect(326, 42, Math.max(0, 118 * p2Pct), 8);
            }
        }

        updateScoreTable() {
            if (!this.p1ScoreCellText) return;

            this.p1ScoreCellText.setText(`👤 P1: ${this.p1Score}`);

            if (this.gameMode === 'duo') {
                this.p2ScoreCellText.setText(`👥 P2: ${this.p2Score}`);

                if (this.p1Score > this.p2Score) {
                    this.tableLeaderText.setText('👑 P1 LIDERANDO');
                    this.tableLeaderText.setColor('#38bdf8');
                } else if (this.p2Score > this.p1Score) {
                    this.tableLeaderText.setText('👑 P2 LIDERANDO');
                    this.tableLeaderText.setColor('#f472b6');
                } else {
                    this.tableLeaderText.setText('🤝 EMPATE TÁTICO');
                    this.tableLeaderText.setColor('#94a3b8');
                }
            } else {
                this.p2ScoreCellText.setText('🤖 SOLO');
                this.tableLeaderText.setText(`TOTAL: ${this.p1Score} PEÇAS`);
                this.tableLeaderText.setColor('#a7f3d0');
            }
        }

        updateTimerBar() {
            this.timerBar.clear();
            const pct = Math.max(0, this.timeLeft / 60);
            let color = 0x22c55e;
            if (pct < 0.4) color = 0xeab308;
            if (pct < 0.2) color = 0xef4444;

            this.timerBar.fillStyle(color, 1);
            this.timerBar.fillRect(487, 42, Math.max(0, 291 * pct), 14);
        }

        createVirtualControls() {
            if (!this.sys.game.device.input.touch) return;

            const makeBtn = (x, y, text, dirX, dirY) => {
                const rect = this.add.rectangle(x, y, 50, 50, 0x1e293b, 0.8).setInteractive();
                rect.setStrokeStyle(2, 0x64748b);
                this.add.text(x, y, text, {
                    fontFamily: '"Press Start 2P", monospace',
                    fontSize: '16px',
                    color: '#ffffff'
                }).setOrigin(0.5);

                rect.on('pointerdown', () => { this.mobileDir = { x: dirX, y: dirY }; });
                rect.on('pointerup', () => { this.mobileDir = { x: 0, y: 0 }; });
                rect.on('pointerout', () => { this.mobileDir = { x: 0, y: 0 }; });
            };

            makeBtn(80, 510, '▲', 0, -1);
            makeBtn(80, 565, '▼', 0, 1);
            makeBtn(30, 538, '◄', -1, 0);
            makeBtn(130, 538, '►', 1, 0);
        }

        setupLevel() {
            this.objectsGroup.clear(true, true);

            if (window.audioSystem) {
                // No modo solo o inimigo não existe. No duo, ativam efeitos de perigo nas fases com inimigo.
                window.audioSystem.setDangerMode(this.gameMode === 'duo' && this.level >= 6);
            }

            const themeIdx = (this.level - 1) % this.bgThemes.length;
            this.bgImage.setTexture(this.bgThemes[themeIdx]);

            // Personagens fixos para evitar confusão no Duo Mode
            this.player1.setTexture('player_slime');
            if (!this.p1Dead) {
                this.player1.setPosition(this.gameMode === 'duo' ? 350 : 400, 330);
                this.player1.setVelocity(0, 0);
            }

            if (this.player2) {
                this.player2.setTexture('player_cat');
                if (!this.p2Dead) {
                    this.player2.setPosition(450, 330);
                    this.player2.setVelocity(0, 0);
                }
            }

            const shapeIdx = (this.level - 1) % this.shapeTypes.length;
            const shapeKey = this.shapeTypes[shapeIdx];

            // Quantidade de peças ajustada no modo Solo para não poluir a tela
            const maxObjects = this.gameMode === 'solo' ? 8 : 6;
            const numObjects = Math.min(maxObjects, 4 + Math.floor((this.level - 1) * (this.gameMode === 'solo' ? 0.6 : 0.4)));

            const targetIndex = Phaser.Math.Between(0, numObjects - 1);

            const baseHue = Phaser.Math.FloatBetween(0, 1);
            // Variação de cor mantida mais legível no Modo Solo
            const hueDiff = this.gameMode === 'duo'
                ? Math.max(0.14, 0.32 - Math.floor((this.level - 1) / 4) * 0.015)
                : Math.max(0.11, 0.30 - Math.floor((this.level - 1) / 4) * 0.02);

            const targetHue = (baseHue + hueDiff) % 1;

            const baseRGB = Phaser.Display.Color.HSVToRGB(baseHue, 0.95, 0.95);
            const targetRGB = Phaser.Display.Color.HSVToRGB(targetHue, 0.95, 0.95);

            const spawnedPositions = [];

            for (let i = 0; i < numObjects; i++) {
                let x, y, validPos = false;
                let attempts = 0;

                while (!validPos && attempts < 100) {
                    x = Phaser.Math.Between(100, 700);
                    y = Phaser.Math.Between(120, 510);
                    attempts++;

                    const distToP1 = Phaser.Math.Distance.Between(x, y, this.player1.x, this.player1.y);
                    const distToP2 = this.player2 ? Phaser.Math.Distance.Between(x, y, this.player2.x, this.player2.y) : 999;
                    if (distToP1 < 100 || distToP2 < 100) continue;

                    validPos = spawnedPositions.every(pos => Phaser.Math.Distance.Between(x, y, pos.x, pos.y) > 80);
                }

                spawnedPositions.push({ x, y });

                const isTarget = (i === targetIndex);
                const colorHex = isTarget ? targetRGB.color : baseRGB.color;

                const puzzleObj = this.physics.add.sprite(x, y, shapeKey);
                puzzleObj.setTint(colorHex);
                puzzleObj.isTarget = isTarget;
                puzzleObj.setCollideWorldBounds(true);
                puzzleObj.setBounce(1, 1);
                puzzleObj.setScale(0);

                this.objectsGroup.add(puzzleObj);

                if (this.level >= 2) {
                    // Velocidade de movimento rebalanceada para o modo solo
                    const baseSpeed = this.gameMode === 'duo' ? 25 : 32;
                    const speedInc = this.gameMode === 'duo' ? 5 : 6;
                    const maxSpeed = this.gameMode === 'duo' ? 85 : 95;
                    const speed = Math.min(maxSpeed, baseSpeed + (this.level - 2) * speedInc);
                    const angle = Phaser.Math.FloatBetween(0, Math.PI * 2);
                    puzzleObj.setVelocity(Math.cos(angle) * speed, Math.sin(angle) * speed);
                }

                this.tweens.add({
                    targets: puzzleObj,
                    scale: 1,
                    duration: 250,
                    ease: 'Back.easeOut',
                    delay: i * 30
                });
            }

            this.physics.add.overlap(this.player1, this.objectsGroup, (p1, obj) => this.handleCollision(p1, obj, 1), null, this);
            if (this.player2) {
                this.physics.add.overlap(this.player2, this.objectsGroup, (p2, obj) => this.handleCollision(p2, obj, 2), null, this);
            }

            // Inimigo ativado exclusivamente no Modo Duo a partir da Fase 4
            const shouldSpawnEnemy = (this.gameMode === 'duo' && this.level >= 4);
            if (shouldSpawnEnemy) {
                if (!this.enemy) {
                    this.enemy = this.physics.add.sprite(720, 120, 'enemy_chaser');
                    this.enemy.setCollideWorldBounds(true);
                    this.enemy.setBounce(0.5);
                    this.enemy.body.setSize(28, 28);
                    
                    this.physics.add.overlap(this.player1, this.enemy, (p1, en) => this.handleEnemyCollision(p1, en, 1), null, this);
                    if (this.player2) {
                        this.physics.add.overlap(this.player2, this.enemy, (p2, en) => this.handleEnemyCollision(p2, en, 2), null, this);
                    }
                } else {
                    this.enemy.setPosition(720, 120);
                    this.enemy.setVelocity(0, 0);
                }
            } else if (this.enemy) {
                this.enemy.destroy();
                this.enemy = null;
            }
        }

        handleEnemyCollision(player, enemy, playerNum) {
            if (this.isGameOver) return;
            if (playerNum === 1 && this.p1Dead) return;
            if (playerNum === 2 && this.p2Dead) return;

            const isCooldown = (playerNum === 1) ? this.p1HitCooldown : this.p2HitCooldown;
            if (isCooldown) return;

            audioSystem.playSFX('hit');
            this.cameras.main.shake(180, 0.02);

            const damage = 25; // 25 HP de dano (4 acertos necessários para eliminação)

            if (playerNum === 1) {
                this.p1HP = Math.max(0, this.p1HP - damage);
                this.p1HitCooldown = true;

                // Efeito visual de invencibilidade temporária
                this.tweens.add({
                    targets: this.player1,
                    alpha: 0.3,
                    duration: 100,
                    yoyo: true,
                    repeat: 5,
                    onComplete: () => {
                        this.p1HitCooldown = false;
                        if (!this.p1Dead) this.player1.setAlpha(1);
                    }
                });

                if (this.p1HP <= 0) {
                    this.p1Dead = true;
                    this.player1.setAlpha(0.2);
                    this.player1.setVelocity(0, 0);
                    this.player1.body.enable = false;
                    this.p1Label.setText('P1 (ELIMINADO)');
                    this.p1Label.setColor('#ef4444');
                }
            } else {
                this.p2HP = Math.max(0, this.p2HP - damage);
                this.p2HitCooldown = true;

                this.tweens.add({
                    targets: this.player2,
                    alpha: 0.3,
                    duration: 100,
                    yoyo: true,
                    repeat: 5,
                    onComplete: () => {
                        this.p2HitCooldown = false;
                        if (!this.p2Dead) this.player2.setAlpha(1);
                    }
                });

                if (this.p2HP <= 0) {
                    this.p2Dead = true;
                    this.player2.setAlpha(0.2);
                    this.player2.setVelocity(0, 0);
                    this.player2.body.enable = false;
                    this.p2Label.setText('P2 (ELIMINADO)');
                    this.p2Label.setColor('#ef4444');
                }
            }

            this.updateHPBars();

            const isDead = (playerNum === 1 && this.p1Dead) || (playerNum === 2 && this.p2Dead);
            const floatingMsg = isDead ? 'ELIMINADO! 💀' : `-${damage} HP! 💥`;

            const penaltyText = this.add.text(player.x, player.y - 25, floatingMsg, {
                fontFamily: '"Press Start 2P", monospace',
                fontSize: '10px',
                color: isDead ? '#ef4444' : '#f97316',
                stroke: '#000000',
                strokeThickness: 4
            }).setOrigin(0.5);

            this.tweens.add({
                targets: penaltyText, y: player.y - 60, alpha: 0, duration: 1000,
                onComplete: () => penaltyText.destroy()
            });

            // Se o P1 morrer no Modo Solo ou se ambos morrerem no Modo Duo, o jogo termina
            if ((this.gameMode === 'solo' && this.p1Dead) || (this.p1Dead && this.p2Dead)) {
                this.endGame();
            }
        }

        handleCollision(player, object, playerNum) {
            if (this.isGameOver) return;
            if (playerNum === 1 && this.p1Dead) return;
            if (playerNum === 2 && this.p2Dead) return;

            if (object.isTarget) {
                audioSystem.playSFX('correct');
                this.emitter.emitParticleAt(object.x, object.y, 25);

                if (playerNum === 1) {
                    this.p1Score++;
                } else {
                    this.p2Score++;
                }

                this.updateScoreTable();

                this.level++;
                
                // Bônus de tempo mais generoso no modo solo
                const bonusTime = this.gameMode === 'solo'
                    ? Math.max(2, 4 - Math.floor((this.level - 1) / 8))
                    : Math.max(1, 3 - Math.floor((this.level - 1) / 6));
                this.timeLeft = Math.min(60, this.timeLeft + bonusTime);

                this.levelText.setText(`FASE: ${this.level}`);
                this.timeText.setText(`TEMPO: ${this.timeLeft}s`);
                this.updateTimerBar();

                this.setupLevel();
            } else {
                audioSystem.playSFX('error');
                this.cameras.main.shake(150, 0.015);

                // Penalidade reduzida no modo solo (-2s em vez de -4s)
                const timeDeduction = this.gameMode === 'solo' ? 2 : 3;
                this.timeLeft = Math.max(0, this.timeLeft - timeDeduction);
                this.timeText.setText(`TEMPO: ${this.timeLeft}s`);
                this.updateTimerBar();

                const penaltyText = this.add.text(object.x, object.y - 20, `-${timeDeduction}s ❌`, {
                    fontFamily: '"Press Start 2P", monospace',
                    fontSize: '12px',
                    color: '#f87171',
                    stroke: '#000000',
                    strokeThickness: 4
                }).setOrigin(0.5);

                this.tweens.add({
                    targets: penaltyText, y: object.y - 50, alpha: 0, duration: 800,
                    onComplete: () => penaltyText.destroy()
                });

                object.destroy();

                if (this.timeLeft <= 0) {
                    this.endGame();
                }
            }
        }

        updateTimer() {
            if (this.isGameOver) return;

            this.timeLeft--;

            this.timeText.setText(`TEMPO: ${this.timeLeft}s`);
            this.updateTimerBar();

            if (this.timeLeft <= 0) {
                this.endGame();
            }
        }

        update() {
            if (this.isGameOver) return;

            const speed = 230;

            // Movimento Jogador 1 (se não estiver morto)
            if (!this.p1Dead) {
                let p1vx = 0; let p1vy = 0;
                const p1Left = this.wasd.left.isDown || (this.gameMode === 'solo' && (this.cursors.left.isDown || this.mobileDir.x < 0));
                const p1Right = this.wasd.right.isDown || (this.gameMode === 'solo' && (this.cursors.right.isDown || this.mobileDir.x > 0));
                const p1Up = this.wasd.up.isDown || (this.gameMode === 'solo' && (this.cursors.up.isDown || this.mobileDir.y < 0));
                const p1Down = this.wasd.down.isDown || (this.gameMode === 'solo' && (this.cursors.down.isDown || this.mobileDir.y > 0));

                if (p1Left) p1vx = -speed;
                else if (p1Right) p1vx = speed;

                if (p1Up) p1vy = -speed;
                else if (p1Down) p1vy = speed;

                if (p1vx !== 0 && p1vy !== 0) { p1vx *= 0.7071; p1vy *= 0.7071; }
                this.player1.setVelocity(p1vx, p1vy);

                if (p1vx > 0) this.player1.setAngle(6);
                else if (p1vx < 0) this.player1.setAngle(-6);
                else this.player1.setAngle(0);
            }

            if (this.p1Label) {
                this.p1Label.setPosition(this.player1.x, this.player1.y - 24);
            }

            // Movimento Jogador 2 (se ativo e não morto)
            if (this.player2 && !this.p2Dead) {
                let p2vx = 0; let p2vy = 0;

                if (this.cursors.left.isDown) p2vx = -speed;
                else if (this.cursors.right.isDown) p2vx = speed;

                if (this.cursors.up.isDown) p2vy = -speed;
                else if (this.cursors.down.isDown) p2vy = speed;

                if (p2vx !== 0 && p2vy !== 0) { p2vx *= 0.7071; p2vy *= 0.7071; }
                this.player2.setVelocity(p2vx, p2vy);

                if (p2vx > 0) this.player2.setAngle(6);
                else if (p2vx < 0) this.player2.setAngle(-6);
                else this.player2.setAngle(0);
            }

            if (this.p2Label && this.player2) {
                this.p2Label.setPosition(this.player2.x, this.player2.y - 24);
            }

            // MECÂNICA DE REVIVER ALIADO NO MODO DUO: Se um estiver morto e o vivo encostar nele
            if (this.gameMode === 'duo' && (this.p1Dead || this.p2Dead)) {
                if (this.p1Dead && !this.p2Dead) {
                    const dist = Phaser.Math.Distance.Between(this.player2.x, this.player2.y, this.player1.x, this.player1.y);
                    if (dist < 40) {
                        this.revivePlayer(1);
                    }
                } else if (this.p2Dead && !this.p1Dead) {
                    const dist = Phaser.Math.Distance.Between(this.player1.x, this.player1.y, this.player2.x, this.player2.y);
                    if (dist < 40) {
                        this.revivePlayer(2);
                    }
                }
            }

            const isEnemyActive = this.enemy && (this.gameMode === 'duo' && this.level >= 4);
            if (isEnemyActive) {
                const startLevel = 4;
                // Dificuldade gradual: velocidade inicial de 70, crescendo 3.5 por fase até o limite de 170
                const enemySpeed = Math.min(170, 70 + (this.level - startLevel) * 3.5);

                let target = null;
                if (!this.p1Dead && (!this.player2 || !this.p2Dead)) {
                    if (this.player2 && !this.p2Dead) {
                        const distP1 = Phaser.Math.Distance.Between(this.enemy.x, this.enemy.y, this.player1.x, this.player1.y);
                        const distP2 = Phaser.Math.Distance.Between(this.enemy.x, this.enemy.y, this.player2.x, this.player2.y);
                        target = distP2 < distP1 ? this.player2 : this.player1;
                    } else {
                        target = this.player1;
                    }
                } else if (!this.p1Dead) {
                    target = this.player1;
                } else if (this.player2 && !this.p2Dead) {
                    target = this.player2;
                }

                if (target) {
                    this.physics.moveToObject(this.enemy, target, enemySpeed);
                } else {
                    this.enemy.setVelocity(0, 0);
                }
            }
        }

        revivePlayer(playerNum) {
            audioSystem.playSFX('correct');

            if (playerNum === 1) {
                this.p1Dead = false;
                this.p1HP = 50; // Restaura metade da vida ao reviver
                this.player1.setAlpha(1);
                this.player1.body.enable = true;
                this.player1.setPosition(this.gameMode === 'duo' ? 350 : 400, 330);
                this.p1Label.setText('P1');
                this.p1Label.setColor('#38bdf8');
            } else {
                this.p2Dead = false;
                this.p2HP = 50; // Restaura metade da vida ao reviver
                this.player2.setAlpha(1);
                this.player2.body.enable = true;
                this.player2.setPosition(450, 330);
                this.p2Label.setText('P2');
                this.p2Label.setColor('#f472b6');
            }

            this.updateHPBars();

            const reviveText = this.add.text(400, 200, `✨ JOGADOR ${playerNum} REVIVIDO (+50 HP)! ✨`, {
                fontFamily: '"Press Start 2P", monospace',
                fontSize: '11px',
                color: '#facc15',
                stroke: '#000000',
                strokeThickness: 4
            }).setOrigin(0.5);

            this.tweens.add({
                targets: reviveText, y: 160, alpha: 0, duration: 1500,
                onComplete: () => reviveText.destroy()
            });
        }

        endGame() {
            this.isGameOver = true;
            this.physics.pause();

            const overBg = this.add.graphics();
            overBg.fillStyle(0x0f172a, 0.96);
            overBg.fillRect(0, 0, 800, 600);

            this.add.text(400, 110, 'GAME OVER', {
                fontFamily: '"Press Start 2P", monospace',
                fontSize: '30px',
                color: '#ef4444'
            }).setOrigin(0.5);

            this.add.text(400, 160, `VOCÊS CHEGARAM À FASE ${this.level}!`, {
                fontFamily: '"Press Start 2P", monospace',
                fontSize: '13px',
                color: '#cbd5e1'
            }).setOrigin(0.5);

            // TABELA FINAL COMPLETA DE DESEMPENHO NO GAME OVER
            const summaryTable = this.add.graphics();
            summaryTable.fillStyle(0x1e293b, 1);
            summaryTable.fillRect(160, 200, 480, 180);
            summaryTable.lineStyle(4, 0x3b82f6, 1);
            summaryTable.strokeRect(160, 200, 480, 180);

            // Header Tabela Final
            summaryTable.fillStyle(0x0f172a, 1);
            summaryTable.fillRect(164, 204, 472, 34);
            summaryTable.lineStyle(2, 0x60a5fa, 1);
            summaryTable.lineBetween(160, 238, 640, 238);

            this.add.text(400, 221, '🏆 TABELA FINAL DE PEÇAS 🏆', {
                fontFamily: '"Press Start 2P", monospace',
                fontSize: '11px',
                color: '#facc15'
            }).setOrigin(0.5);

            // Linha P1
            this.add.text(200, 265, '👤 JOGADOR 1 (P1):', {
                fontFamily: '"Press Start 2P", monospace',
                fontSize: '11px',
                color: '#38bdf8'
            });
            this.add.text(580, 265, `${this.p1Score} Peças`, {
                fontFamily: '"Press Start 2P", monospace',
                fontSize: '11px',
                color: '#ffffff'
            }).setOrigin(1, 0);

            // Linha P2
            const p2ScoreTxt = this.gameMode === 'duo' ? `${this.p2Score} Peças` : 'N/A';
            this.add.text(200, 300, '👥 JOGADOR 2 (P2):', {
                fontFamily: '"Press Start 2P", monospace',
                fontSize: '11px',
                color: '#f472b6'
            });
            this.add.text(580, 300, p2ScoreTxt, {
                fontFamily: '"Press Start 2P", monospace',
                fontSize: '11px',
                color: '#ffffff'
            }).setOrigin(1, 0);

            // Vencedor Anúncio na Tabela Final
            let winnerMessage = '';
            let winnerColor = '#facc15';

            if (this.gameMode === 'duo') {
                if (this.p1Score > this.p2Score) {
                    winnerMessage = '👑 VENCEDOR: JOGADOR 1 (P1)!';
                    winnerColor = '#38bdf8';
                } else if (this.p2Score > this.p1Score) {
                    winnerMessage = '👑 VENCEDOR: JOGADOR 2 (P2)!';
                    winnerColor = '#f472b6';
                } else {
                    winnerMessage = '🤝 EMPATE! AMBOS COLETARAM O MESMO!';
                    winnerColor = '#a7f3d0';
                }
            } else {
                winnerMessage = `⭐ TOTAL COLETADO: ${this.p1Score} PEÇAS`;
                winnerColor = '#facc15';
            }

            summaryTable.lineStyle(1, 0x475569, 1);
            summaryTable.lineBetween(180, 332, 620, 332);

            this.add.text(400, 354, winnerMessage, {
                fontFamily: '"Press Start 2P", monospace',
                fontSize: '10px',
                color: winnerColor
            }).setOrigin(0.5);

            // Botão 1: Reiniciar modo atual
            const btnRestartBg = this.add.graphics();
            btnRestartBg.fillStyle(0x2563eb, 1);
            btnRestartBg.fillRect(150, 420, 230, 52);
            btnRestartBg.lineStyle(4, 0x60a5fa, 1);
            btnRestartBg.strokeRect(150, 420, 230, 52);

            this.add.text(265, 446, '🔄 REINICIAR', {
                fontFamily: '"Press Start 2P", monospace',
                fontSize: '11px',
                color: '#ffffff'
            }).setOrigin(0.5);

            const btnRestartZone = this.add.zone(265, 446, 230, 52).setInteractive({ useHandCursor: true });
            btnRestartZone.on('pointerdown', () => {
                audioSystem.playSFX('click');
                this.scene.restart({ mode: this.gameMode });
            });

            // Botão 2: Alternar para o outro modo de jogo
            const otherMode = this.gameMode === 'solo' ? 'duo' : 'solo';
            const otherModeBtnText = this.gameMode === 'solo' ? '👥 JOGAR DUO' : '👤 JOGAR SOLO';

            const btnSwitchBg = this.add.graphics();
            btnSwitchBg.fillStyle(0x9333ea, 1);
            btnSwitchBg.fillRect(420, 420, 230, 52);
            btnSwitchBg.lineStyle(4, 0xc084fc, 1);
            btnSwitchBg.strokeRect(420, 420, 230, 52);

            this.add.text(535, 446, otherModeBtnText, {
                fontFamily: '"Press Start 2P", monospace',
                fontSize: '11px',
                color: '#ffffff'
            }).setOrigin(0.5);

            const btnSwitchZone = this.add.zone(535, 446, 230, 52).setInteractive({ useHandCursor: true });
            btnSwitchZone.on('pointerdown', () => {
                audioSystem.playSFX('click');
                this.scene.start('GameScene', { mode: otherMode });
            });
        }
    }

    const config = {
        type: Phaser.AUTO,
        parent: 'game-container',
        width: 800,
        height: 600,
        backgroundColor: '#030712',
        scale: {
            mode: Phaser.Scale.FIT,
            autoCenter: Phaser.Scale.CENTER_BOTH
        },
        physics: {
            default: 'arcade',
            arcade: {
                gravity: { y: 0 },
                debug: false
            }
        },
        scene: [BootScene, StartScene, GameScene]
    };

    window.onload = () => {
        new Phaser.Game(config);
    };
    </script>
</body>
</html>
