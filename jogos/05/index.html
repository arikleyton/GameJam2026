const A={on:false,t:{drone:0,breath:0,muffle:600},cur:{drone:0,breath:0,muffle:600},music:{mode:'none',next:0,step:0}};
function ainit(){
  if(A.on)return; const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return; A.on=true;
  const c=A.c=new AC();
  A.master=c.createGain(); A.master.gain.value=0.75;
  A.filter=c.createBiquadFilter(); A.filter.type='lowpass'; A.filter.frequency.value=600;
  A.master.connect(A.filter); A.filter.connect(c.destination);
  A.rev=c.createGain(); A.rev.gain.value=0.6;
  const d1=c.createDelay(1),d2=c.createDelay(1); d1.delayTime.value=0.27; d2.delayTime.value=0.43;
  const fb=c.createGain(); fb.gain.value=0.38; const lp=c.createBiquadFilter(); lp.frequency.value=2400;
  A.rev.connect(d1); A.rev.connect(d2); d1.connect(fb); d2.connect(fb); fb.connect(lp); lp.connect(d1); lp.connect(A.master);
  A.droneG=c.createGain(); A.droneG.gain.value=0;
  const dl=c.createBiquadFilter(); dl.frequency.value=150; dl.Q.value=3;
  [['sawtooth',55],['sawtooth',55.7],['sine',41.2]].forEach(([t,f])=>{const o=c.createOscillator();o.type=t;o.frequency.value=f;o.connect(dl);o.start();});
  dl.connect(A.droneG); A.droneG.connect(A.master);
  const ns=c.createBufferSource(); ns.buffer=noiseBuf(2); ns.loop=true;
  const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=450; bp.Q.value=0.8;
  A.breathG=c.createGain(); A.breathG.gain.value=0; ns.connect(bp); bp.connect(A.breathG); A.breathG.connect(A.master); ns.start();
  A.music.next=c.currentTime+0.2;
}
function noiseBuf(sec){const c=A.c;const b=c.createBuffer(1,Math.floor(c.sampleRate*sec),c.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b;}
function tone(f,o={}){ if(!A.on)return; const c=A.c; const {type='sine',dur=1.5,vol=0.2,att=0.01,at=0,rev=0.35,filt=0}=o;
  const t0=c.currentTime+at; const os=c.createOscillator(); os.type=type; os.frequency.value=f;
  const g=c.createGain(); g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+att); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  let n=os; if(filt){const fl=c.createBiquadFilter();fl.frequency.value=filt;os.connect(fl);n=fl;}
  n.connect(g); g.connect(A.master); if(rev){const r=c.createGain();r.gain.value=rev;g.connect(r);r.connect(A.rev);}
  os.start(t0); os.stop(t0+dur+0.05);
}
function noise(o={}){ if(!A.on)return; const c=A.c; const {dur=0.2,vol=0.2,filt=800,type='lowpass',at=0,att=0.005}=o;
  const t0=c.currentTime+at; const s=c.createBufferSource(); s.buffer=noiseBuf(dur+0.1);
  const f=c.createBiquadFilter(); f.type=type; f.frequency.value=filt; const g=c.createGain();
  g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+att); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  s.connect(f);f.connect(g);g.connect(A.master); s.start(t0); s.stop(t0+dur+0.1);
}
function piano(f,vol=0.16,at=0,dur=2.8){tone(f,{vol,at,dur});tone(f*2,{vol:vol*0.22,at,dur:dur*0.6});tone(f,{type:'triangle',vol:vol*0.25,at,dur:dur*0.5});}
function guitar(f,vol=0.12,at=0){tone(f,{type:'triangle',vol,at,dur:1.2,att:0.004,filt:2200});tone(f*2,{vol:vol*0.3,at,dur:0.5,att:0.004});}
function pad(fs,vol=0.05,at=0,dur=3.8){fs.forEach(f=>tone(f,{vol,at,dur,att:0.9,rev:0.5}));}
function kick(at=0){ if(!A.on)return;const c=A.c;const t0=c.currentTime+at;const o=c.createOscillator();o.frequency.setValueAtTime(120,t0);o.frequency.exponentialRampToValueAtTime(40,t0+0.15);const g=c.createGain();g.gain.setValueAtTime(0.25,t0);g.gain.exponentialRampToValueAtTime(0.0001,t0+0.3);o.connect(g);g.connect(A.master);o.start(t0);o.stop(t0+0.35);}

function setMusic(mode){A.music.mode=mode;A.music.step=0;if(A.on)A.music.next=A.c.currentTime+0.15;}
function setAmb(ph){const i=ph-1; A.t.drone=[0.16,0.13,0.06,0.02,0,0,0][i]; A.t.breath=[0.09,0.07,0.03,0,0,0,0][i]; A.t.muffle=[550,700,1800,4000,12000,18000,20000][i]; const mm=['none','none','piano','piano','guitar','guitar','full'][i]; if(A.music.mode!==mm)setMusic(mm);}
function musicUpdate(){
 if(!A.on)return; const now=A.c.currentTime, m=A.music;
 A.cur.drone+=(A.t.drone-A.cur.drone)*0.02; A.cur.breath+=(A.t.breath-A.cur.breath)*0.02; A.cur.muffle+=(A.t.muffle-A.cur.muffle)*0.01;

  if(m.mode==='piano'){const sc=[220,261.6,293.7,329.6,392,440];piano(sc[Math.floor(Math.random()*sc.length)],0.12,at,3.2);if(Math.random()<0.3)piano(110,0.07,at,3);m.next+=2.6+Math.random()*1.4;}
  else if(m.mode==='guitar'){const ch=CH[['Am','F','C','G'][Math.floor(s/16)%4]];guitar(ch[[0,1,2,3,2,1,0,1][s%8]],0.1,at);if(s%16===0)piano(ch[0]/2,0.07,at,3.2);m.step++;m.next+=0.3;}
  else if(m.mode==='full'){const ch=CH[['C','G','Am','F'][Math.floor(s/16)%4]];guitar(ch[[0,1,2,3,2,1,0,2][s%8]],0.1,at);if(s%16===0)pad(ch,0.04,at,4.5);if(s%4===0)kick(at);const mel=[659.25,783.99,880,783.99,659.25,587.33,523.25,587.33];if(s%2===0)piano(mel[Math.floor(s/2)%8],0.085,at,1.4);m.step++;m.next+=0.25;}
  else if(m.mode==='ending'){const mel=[261.6,329.6,392,329.6,440,392,329.6,293.7,261.6,196,261.6,329.6];piano(mel[s%mel.length],0.12,at,3.6);if(s%4===0)piano([130.8,98,110,87.3][Math.floor(s/4)%4],0.07,at,4);if(s%12===11)pad([261.6,329.6,392],0.03,at,5);m.step++;m.next+=1.35;}
 }
