        const title = this.add.text(400, 215, 'JOGO PAUSADO', {
            fontFamily: '"Press Start 2P"', fontSize: '22px', fill: '#ffd54f',
            stroke: '#000000', strokeThickness: 5
        }).setOrigin(0.5);
        const hint = this.add.text(400, 260, '↑ / ↓  ESCOLHER     ENTER  CONFIRMAR', {
            fontFamily: '"Press Start 2P"', fontSize: '7px', fill: '#ab47bc'
        }).setOrigin(0.5);
        this.pauseContinueText = this.add.text(400, 315, 'CONTINUAR', {
            fontFamily: '"Press Start 2P"', fontSize: '13px', fill: '#ffffff', stroke: '#000000', strokeThickness: 3
        }).setOrigin(0.5);
        this.pauseMenuText = this.add.text(400, 365, 'SAIR PARA O MENU', {
            fontFamily: '"Press Start 2P"', fontSize: '13px', fill: '#888888', stroke: '#000000', strokeThickness: 3
        }).setOrigin(0.5);
        const footer = this.add.text(400, 415, 'ESC / P  •  VOLTAR AO JOGO', {
            fontFamily: '"Press Start 2P"', fontSize: '7px', fill: '#666666'
        }).setOrigin(0.5);
        this.pauseLayer.add([dim, panel, title, hint, this.pauseContinueText, this.pauseMenuText, footer]);
        this.updatePauseSelection();
    }

    updatePauseSelection() {
        if (!this.pauseContinueText || !this.pauseMenuText) return;
        const selected = this.pauseSelection === 0;
        this.pauseContinueText.setFill(selected ? '#00e676' : '#777777').setScale(selected ? 1.08 : 1);
        this.pauseMenuText.setFill(selected ? '#777777' : '#ff4081').setScale(selected ? 1 : 1.08);
    }

    openPauseMenu() {
        if (this.gamePaused || this.isDead || this.preBattleCountdown) return;
        this.gamePaused = true;
        this.pauseSelection = 0;
        this.updatePauseSelection();
        this.pauseLayer.setVisible(true);
        this.physics.pause();
        this.time.paused = true;
        Sound.menuSelect();
    }

    closePauseMenu() {
        if (!this.gamePaused) return;
        this.gamePaused = false;
        this.pauseLayer.setVisible(false);
        this.time.paused = false;
        this.physics.resume();
        Sound.menuSelect();
    }

    handlePauseInput() {
        if (Phaser.Input.Keyboard.JustDown(this.pauseKeyEsc) || Phaser.Input.Keyboard.JustDown(this.pauseKeyP)) {
            this.closePauseMenu();
            return;
        }
        if (Phaser.Input.Keyboard.JustDown(this.pauseUpKey) || Phaser.Input.Keyboard.JustDown(this.keyJump) || Phaser.Input.Keyboard.JustDown(this.keyW)) {
            this.pauseSelection = (this.pauseSelection + 1) % 2;
            this.updatePauseSelection();
            Sound.menuSelect();
        }
        if (Phaser.Input.Keyboard.JustDown(this.pauseDownKey) || Phaser.Input.Keyboard.JustDown(this.keyDown) || Phaser.Input.Keyboard.JustDown(this.keyS)) {
            this.pauseSelection = (this.pauseSelection + 1) % 2;
            this.updatePauseSelection();
            Sound.menuSelect();
        }
        if (Phaser.Input.Keyboard.JustDown(this.pauseConfirmKey) || Phaser.Input.Keyboard.JustDown(this.parryKey)) {
            if (this.pauseSelection === 0) {
                this.closePauseMenu();
            } else {
                try { sessionStorage.removeItem('captusIntroSeen'); } catch (err) {}
                this.scene.start('MenuScene');
            }
        }
    }

    createBattleCountdown() {
        this.countdownLayer = this.add.container(400, 300).setDepth(450).setVisible(false);
        this.countdownText = this.add.text(0, 0, '', {
            fontFamily: '"Press Start 2P"', fontSize: '76px', fill: '#ffd54f',
            stroke: '#17051f', strokeThickness: 12
        }).setOrigin(0.5);
        this.countdownGlow = this.add.circle(0, 0, 80, 0x00e5ff, 0.12);
        this.countdownLayer.add([this.countdownGlow, this.countdownText]);
    }

    startBattleCountdown() {
        if (!this.preBattleCountdown || this.countdownRunning) return;
        this.countdownRunning = true;
        this.countdownLayer.setVisible(true);
        const steps = ['3', '2', '1', 'MÁGICA'];
        let index = 0;
        const showStep = () => {
            if (index >= steps.length) {
                this.countdownLayer.setVisible(false);
                this.preBattleCountdown = false;
                this.countdownRunning = false;
                if (this.bossShootTimer) this.bossShootTimer.paused = false;
                this.physics.resume();
                if (this.bossPhase === 1 && !this.isDead) this.startBossDynamicMovement(1);
                Sound.phaseChange();
                return;
            }
            const word = steps[index];
            this.countdownText.setText(word).setFill(word === 'MÁGICA' ? '#00e5ff' : '#ffd54f');
            this.countdownText.setScale(0.45).setAlpha(1).setAngle(index % 2 === 0 ? -2 : 2);
            this.countdownGlow.setScale(0.45).setAlpha(0.2);
            const burst = this.add.particles(this.countdownLayer.x, this.countdownLayer.y, 'red_orb', {
                speed: { min: 80, max: 230 }, scale: { start: 0.55, end: 0 }, lifespan: 420, quantity: index === 3 ? 26 : 14,
                tint: index === 3 ? [0x00e5ff, 0xffffff, 0xffd54f] : [0xffd54f, 0xff1744, 0xffffff], emitting: false
            }).setDepth(451);
            burst.explode();
            this.tweens.add({
                targets: [this.countdownText, this.countdownGlow],
                scale: index === 3 ? 1.18 : 1.0, duration: 240, ease: 'Back.Out',
                onComplete: () => {
                    this.tweens.add({
                        targets: [this.countdownText, this.countdownGlow],
                        alpha: 0, scale: index === 3 ? 1.3 : 1.12, duration: 380,
                        onComplete: () => {
                            burst.destroy();
                            index++;
                            showStep();
                        }
                    });
                }
            });
            if (index === 3) Sound.specialCast(); else Sound.menuSelect();
        };
        this.physics.pause();
        showStep();
    }

    createCircusBackground() {
        this.bgContainer = this.add.container(0, 0);
        this.circusBgRect = this.add.rectangle(400, 300, 800, 600, 0x3d0c1e).setOrigin(0.5);
        this.bgContainer.add(this.circusBgRect);
        this.tentStripes = [];
        for (let i = 0; i < 16; i++) {
            let color = i % 2 === 0 ? 0xb71c1c : 0xffc107;
            let stripe = this.add.triangle(i * 50 + 25, 0, i * 50, 0, i * 50 + 50, 0, i * 50 + 25, 220, color).setAlpha(0.75);
            this.bgContainer.add(stripe);
            // Listra de sombra
            let shadow = this.add.triangle(i * 50 + 25, 0, i * 50, 0, i * 50 + 50, 0, i * 50 + 25, 220, 0x000000, 0.15);
            this.bgContainer.add(shadow);
            this.tentStripes.push(stripe);
        }
        let leftCurtain = this.add.rectangle(20, 250, 60, 500, 0x880e4f).setOrigin(0.5);
        let rightCurtain = this.add.rectangle(780, 250, 60, 500, 0x880e4f).setOrigin(0.5);
        this.bgContainer.add(leftCurtain);
        this.bgContainer.add(rightCurtain);
        // Listras nas cortinas
        for (let i = 0; i < 5; i++) {
            const cl = this.add.rectangle(20, 50 + i * 100, 58, 8, 0x4a0a2a, 0.4).setOrigin(0.5);
            const cr = this.add.rectangle(780, 50 + i * 100, 58, 8, 0x4a0a2a, 0.4).setOrigin(0.5);
            this.bgContainer.add(cl); this.bgContainer.add(cr);
        }
        this.circusLights = [];
        for (let i = 0; i < 16; i++) {
            let light = this.add.circle(i * 50 + 25, 215, 6, 0xffffff);
            this.bgContainer.add(light);
            this.circusLights.push(light);
        }
        this.add.rectangle(400, 532, 680, 76, 0x13081f, 0.88).setDepth(1);
        this.add.rectangle(400, 520, 680, 5, 0xffca28, 0.35).setDepth(2);
        for (let i = 0; i < 18; i++) {
            const seat = this.add.rectangle(80 + i * 36, 545, 24, 10, i % 2 === 0 ? 0x5c1d45 : 0x2f5a70, 0.75).setDepth(2);
            this.tweens.add({ targets: seat, y: '+=2', duration: 700 + i * 12, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
        }
        this.time.addEvent({ delay: 300, callback: () => {
            this.circusLights.forEach((l, idx) => {
                l.setFillStyle((Math.floor(Date.now() / 300) + idx) % 2 === 0 ? 0xffea00 : 0xff1744);
            });
        }, loop: true });
    }

    updateCircusThemeForPhase(phase) {
        let targetBgColor, stripeColors;
        if (phase === 1) { targetBgColor = 0x3d0c1e; stripeColors = [0xb71c1c, 0xffc107]; }
        else if (phase === 2) { targetBgColor = 0x1a0033; stripeColors = [0x4a148c, 0xff4081]; }
        else if (phase === 3) { targetBgColor = 0x331400; stripeColors = [0xe65100, 0xffab00]; }
        else if (phase === 4) { targetBgColor = 0x002b36; stripeColors = [0x00e5ff, 0xff1744]; }
        this.tweens.addCounter({ from: 0, to: 100, duration: 1000, onUpdate: () => {
            this.circusBgRect.setFillStyle(targetBgColor);
            this.tentStripes.forEach((stripe, idx) => stripe.setFillStyle(stripeColors[idx % 2]));
        }});
        this.cameras.main.shake(400, 0.015);
    }

    createHUD() {
        this.hudTitle = this.add.text(400, 20, 'WIZARD WEASEL — FASE 1', {
            fontFamily: '"Press Start 2P"', fontSize: '11px', fill: '#ff1744', stroke: '#000', strokeThickness: 3
        }).setOrigin(0.5);
        this.add.rectangle(400, 44, 604, 18, 0x000000).setStrokeStyle(2, 0xffffff);
        this.hpBar = this.add.rectangle(98, 44, 600, 12, 0xff1744).setOrigin(0, 0.5);

        this.specialHud = this.add.container(650, 543).setDepth(180);
        this.specialPanel = this.add.rectangle(0, 0, 292, 50, 0x05050a, 0.86).setStrokeStyle(2, 0xffd54f, 0.9);
        this.specialFrame = this.add.rectangle(0, 9, 264, 14, 0x020208, 0.95).setStrokeStyle(1, 0xffd54f);
        this.specialBar = this.add.rectangle(-132, 9, 0, 8, 0xffd54f).setOrigin(0, 0.5);
        this.specialLabel = this.add.text(0, -11, 'ESPECIAL [V] — 0/70', {
            fontFamily: '"Press Start 2P"', fontSize: '7px', fill: '#ffd54f', stroke: '#000000', strokeThickness: 2
        }).setOrigin(0.5).setDepth(181);
        this.specialHud.add([this.specialPanel, this.specialFrame, this.specialBar, this.specialLabel]);

        this.add.text(400, 585, 'Move: [SETAS]/[WASD] | Pulo: [CIMA] 2x | Dash: [SHIFT] | Parry: [ESPAÇO] | Especial: [V]', {
            fontFamily: '"Press Start 2P"', fontSize: '7px', fill: '#ffd700'
        }).setOrigin(0.5);
        this.updateSpecialMeter();
    }

    updateHpBar(current, max, color = 0xff1744) {
        let percent = Math.max(0, current / max);
        this.hpBar.setFillStyle(color);
        this.tweens.add({ targets: this.hpBar, width: 600 * percent, duration: 100, ease: 'Linear' });
    }

    updateSpecialMeter() {
        if (!this.specialBar || !this.specialLabel) return;
        const percent = Math.max(0, Math.min(1, this.specialHits / this.specialRequired));
        this.tweens.add({ targets: this.specialBar, width: 264 * percent, duration: 100, ease: 'Linear' });
        const wasReady = this.__lastSpecialReady;
        if (this.specialReady && !wasReady) Sound.specialReady();
        this.__lastSpecialReady = this.specialReady;
        if (this.specialReady) {
            this.specialLabel.setText('ESPECIAL [V] — PRONTO!');
            this.specialLabel.setFill('#fff176');
            this.specialLabel.setScale(1.08);
        } else {
            this.specialLabel.setText(`ESPECIAL [V] — ${this.specialHits}/${this.specialRequired}`);
            this.specialLabel.setFill('#ffd54f');
            this.specialLabel.setScale(1);
        }
    }

    showPhaseBanner(text) {
        let banner = this.add.text(400, 240, text, {
            fontFamily: '"Press Start 2P"', fontSize: '22px', fill: '#ffd700', stroke: '#000000', strokeThickness: 8
        }).setOrigin(0.5).setDepth(150);
        this.tweens.add({ targets: banner, scale: 1.25, alpha: 0, duration: 1800, ease: 'Sine.easeOut', onComplete: () => banner.destroy() });
    }

    setupPhase1Timers() {
        // O boss fica completamente parado durante o contador 3-2-1-MÁGICA.
        this.bossShootTimer = this.time.addEvent({ delay: 1400, callback: this.fireBossOrb, callbackScope: this, loop: true });
    }

    stopBossDynamicMovement() {
        this.bossMoveGeneration++;
        if (this.bossMoveTimer) { this.bossMoveTimer.remove(); this.bossMoveTimer = null; }
        if (this.boss) this.tweens.killTweensOf(this.boss);
        this.bossIsMoving = false;
    }

    startBossDynamicMovement(phase) {
        if (this.isDead || !this.boss || !this.boss.active) return;
        this.bossMoveGeneration++;
        const generation = this.bossMoveGeneration;
        if (this.bossMoveTimer) { this.bossMoveTimer.remove(); this.bossMoveTimer = null; }
        this.tweens.killTweensOf(this.boss);
        this.bossIsMoving = false;
        const moveAgain = () => {
            if (this.isDead || !this.boss || !this.boss.active) return;
            if (this.bossMoveGeneration !== generation || this.bossPhase !== phase) return;
            const minX = 125, maxX = 690;
            const minY = phase === 1 ? 170 : 130;
            const maxY = phase === 1 ? 405 : 440;
            let targetX = Phaser.Math.Between(minX, maxX);
            let targetY = Phaser.Math.Between(minY, maxY);
            let tries = 0;
            while (Phaser.Math.Distance.Between(this.boss.x, this.boss.y, targetX, targetY) < 150 && tries < 8) {
                targetX = Phaser.Math.Between(minX, maxX);
                targetY = Phaser.Math.Between(minY, maxY);
                tries++;
            }
            this.bossIsMoving = true;
            const duration = phase === 1 ? Phaser.Math.Between(850, 1450) : Phaser.Math.Between(600, 1050);
            this.tweens.add({ targets: this.boss, x: targetX, y: targetY, duration,
                ease: phase === 1 ? 'Sine.easeInOut' : 'Cubic.easeInOut',
                onComplete: () => {
                    if (this.bossMoveGeneration !== generation || this.bossPhase !== phase || this.isDead) return;
                    this.bossIsMoving = false;
                    this.bossMoveTimer = this.time.delayedCall(Phaser.Math.Between(180, phase === 1 ? 550 : 320), moveAgain, [], this);
                }
            });
        };
        moveAgain();
    }

    executeBossGlide() {
        if (this.isDead || this.bossIsMoving || (this.bossPhase !== 4 || this.finalPhaseState !== 'dash')) return;
        this.bossIsMoving = true;
        this.tweens.killTweensOf(this.boss);
        let targetX = this.boss.x > 400 ? 150 : 650;
        let targetY = Phaser.Math.Between(200, 400);
        this.boss.setTint(0xff1744);
        this.time.delayedCall(300, () => {
            if (this.isDead || !this.boss.active) return;
            this.boss.clearTint();
            this.tweens.add({ targets: this.boss, x: targetX, y: targetY, duration: 1200, ease: 'Sine.easeInOut',
                onComplete: () => {
                    this.bossIsMoving = false;
                    if (this.bossPhase === 4 && this.finalPhaseState === 'dash' && !this.isDead) {
                        this.time.delayedCall(800, () => { if (!this.bossIsMoving) this.executeBossGlide(); });
                    }
                }});
        });
    }

    fireBossOrb() {
        if (this.isDead || !this.boss.active || this.bossPhase === 3) return;
        this.shotCount++;
        let isPink = this.bossPhase === 4
            ? (this.shotCount % 2 === 0)
            : (this.bossPhase === 2 ? (this.shotCount % 2 === 0) : (this.shotCount % 3 === 0));
        this.playBossMagicCast(isPink);
        Sound.bossShoot();
        this.bossCastPulse = 0.32;
        let texture = isPink ? 'pink_orb' : 'red_orb';
        let orb = this.bossOrbs.create(this.boss.x - 20, this.boss.y, texture);
        orb.isPink = isPink;
        orb.setCircle(isPink ? 12 : 9);
        let particles = this.add.particles(0, 0, texture, { speed: 25, scale: { start: 0.5, end: 0 }, lifespan: 200, blendMode: 'ADD' });
        particles.startFollow(orb);
        orb.particles = particles;
        const orbSpeed = this.bossPhase === 4 ? (isPink ? 470 : 540) : (isPink ? 310 : 370);
        this.physics.moveToObject(orb, this.player, orbSpeed);
    }

    playBossMagicCast(isPink) {
        if (!this.boss || !this.boss.active || this.isDead) return;
        const magicColor = isPink ? 0xff4081 : 0xff1744;
        const coreX = this.boss.x - 28, coreY = this.boss.y - 3;
        if (this.bossMagicCore) {
            this.bossMagicCore.setPosition(coreX, coreY);
            this.bossMagicCore.setFillStyle(magicColor, 0.95);
            this.bossMagicCore.setScale(0.7);
            this.bossMagicCore.setAlpha(0.95);
            this.tweens.add({ targets: this.bossMagicCore, scale: 1.8, alpha: 0, duration: 260, ease: 'Quad.easeOut' });
        }
        const circle = this.add.circle(coreX, coreY, 10, magicColor, 0.12).setDepth(21);
        circle.setStrokeStyle(2, magicColor, 0.8);
        this.tweens.add({ targets: circle, scale: 2.5, alpha: 0, rotation: Math.PI * 0.7, duration: 320, ease: 'Cubic.easeOut', onComplete: () => circle.destroy() });
        for (let i = 0; i < 7; i++) {
            const a = (Math.PI * 2 * i) / 7;
            const spark = this.add.rectangle(coreX, coreY, 4, 10, magicColor, 0.9).setDepth(22);
            spark.setRotation(a);
            this.tweens.add({ targets: spark,
                x: coreX + Math.cos(a) * Phaser.Math.Between(22, 38),
                y: coreY + Math.sin(a) * Phaser.Math.Between(22, 38),
                alpha: 0, scale: 0.4, duration: 260, ease: 'Quad.easeOut',
                onComplete: () => spark.destroy() });
        }
        this.boss.setTint(magicColor);
        this.time.delayedCall(90, () => { if (this.boss && this.boss.active) this.boss.clearTint(); });
    }

    removeCarouselPlatforms() {
        this.dropThroughPlatform = false;
        this.dropThroughUntil = 0;
        if (!this.carouselPlatforms) return;
        this.carouselPlatforms.clear(true, true);
        this.carouselPlatforms = null;
    }

    transitionToPhase2() {
        if (this.bossPhase !== 1 || this.isDead) return;
        this.bossPhase = 2;
        this.bossIsMoving = false;
        this.removeCarouselPlatforms();
        this.stopBossDynamicMovement();
        this.updateCircusThemeForPhase(2);
        this.hudTitle.setText('WIZARD WEASEL — FASE 2');
        this.hudTitle.setFill('#ff4081');
        this.showPhaseBanner("FASE 2: MAGIA FLUTUANTE!");
        Sound.phaseChange();
        this.boss.setActive(true); this.boss.setVisible(true); this.boss.setAlpha(1);
        this.boss.setPosition(Phaser.Math.Clamp(this.boss.x, 100, 700), Phaser.Math.Clamp(this.boss.y, 100, 450));
        if (this.bossHitbox && this.bossHitbox.active) this.bossHitbox.setPosition(this.boss.x, this.boss.y);
        this.startBossDynamicMovement(2);
    }

    transitionToPhase3() {
        if (this.bossPhase !== 2) return;
        this.bossPhase = 3;
        this.bossIsMoving = false;
        this.stopBossDynamicMovement();
        this.updateCircusThemeForPhase(3);
        this.hudTitle.setText('MINI-BOSS: COELHO GIGANTE!');
        this.hudTitle.setFill('#ffab00');
        this.showPhaseBanner("ALERTA: COELHO GIGANTE!");
        Sound.phaseChange();
        this.tweens.add({ targets: this.boss, y: -150, duration: 800 });
        this.time.delayedCall(900, () => {
            // COELHO: sprite visual separado da hitbox física.
            // Isso impede que um impacto em física/overlap faça o desenho desaparecer.
            this.rabbit = this.add.image(835, 365, 'giant_rabbit').setDepth(24);
            this.rabbit.setActive(true);
            this.rabbit.setVisible(true);

            this.rabbitHitbox = this.physics.add.sprite(835, 365, 'giant_rabbit');
            this.rabbitHitbox.setVisible(false);
            this.rabbitHitbox.setActive(true);
            this.rabbitHitbox.body.allowGravity = false;
            this.rabbitHitbox.setImmovable(true);
            this.rabbitHitbox.body.moves = false;
            this.rabbitHitbox.body.enable = false;
            this.rabbitHitbox.body.setSize(86, 128, true);

            this.updateHpBar(this.rabbitHP, this.rabbitMaxHP, 0xffab00);

            // Movimento manual em formato de quique, como uma bola.
            // O sprite e a hitbox usam a mesma posição em cada frame.
            this.rabbitVX = -245;
            this.rabbitVY = -330;
            this.rabbitGravity = 720;
            this.rabbitBounce = 0.92;
            this.rabbitFloorY = 445;
            this.rabbitCeilingY = 135;
            this.rabbitLeftX = 105;
            this.rabbitRightX = 785;
            this.rabbitBobbingTime = 0;
            this.rabbit.setFlipX(true);
            this.rabbitHitbox.setPosition(this.rabbit.x, this.rabbit.y);

            this.rabbitShootTimer = this.time.addEvent({ delay: 2200, callback: this.shootRabbitCarrot, callbackScope: this, loop: true });
        });
    }

    shootRabbitCarrot() {
        if (this.bossPhase !== 3 || !this.rabbit || !this.rabbit.active || !this.player || !this.player.active || this.isDead) return;
        let carrot = this.carrots.create(this.rabbit.x - 42, this.rabbit.y - 8, 'carrot');
        carrot.setAngularVelocity(360);
        this.physics.moveToObject(carrot, this.player, 355);
        carrot.setData('spawnTime', this.time.now);
        Sound.bossShoot();
    }

    transitionToPhase4() {
        if (this.bossPhase !== 3 || this.isDead) return;

        this.bossPhase = 4;
        this.bossIsMoving = false;
        this.stopBossDynamicMovement();
        this.updateCircusThemeForPhase(4);

        if (this.rabbitShootTimer) {
            this.rabbitShootTimer.remove();
            this.rabbitShootTimer = null;
        }
        if (this.rabbitHitbox) {
            this.rabbitHitbox.setActive(false);
            this.rabbitHitbox.destroy();
            this.rabbitHitbox = null;
        }
        // Durante a explosão o boss não pode receber tiros acidentais fora da tela.
        if (this.bossHitbox) {
            this.bossHitbox.setActive(false);
            this.bossHitbox.body.enable = false;
        }

        const rx = this.rabbit ? this.rabbit.x : 400;
        const ry = this.rabbit ? this.rabbit.y : 330;

        // O coelho explode antes da entrada triunfal do Fuinha.
        Sound.specialExplode();
        this.cameras.main.shake(420, 0.028);
        this.cameras.main.flash(180, 255, 210, 210);

        const core = this.add.circle(rx, ry, 26, 0xffffff, 0.95).setDepth(170);
        const shock = this.add.circle(rx, ry, 30, 0xffab00, 0).setStrokeStyle(7, 0xffab00, 0.95).setDepth(169);
        const shock2 = this.add.circle(rx, ry, 20, 0xff1744, 0).setStrokeStyle(4, 0xff1744, 0.9).setDepth(168);
        const burst = this.add.particles(rx, ry, 'carrot', {
            speed: { min: 120, max: 520 },
            angle: { min: 0, max: 360 },
            scale: { start: 1.15, end: 0 },
            rotate: { min: -180, max: 180 },
            lifespan: 750,
            quantity: 32,
            emitting: false
        }).setDepth(171);
        burst.explode();

        const cardBurst = this.add.particles(rx, ry, 'card_bullet', {
            speed: { min: 160, max: 450 },
            angle: { min: 0, max: 360 },
            scale: { start: 0.9, end: 0 },
            lifespan: 620,
            quantity: 20,
            emitting: false,
            tint: [0xff1744, 0xffd54f, 0xffffff]
        }).setDepth(172);
        cardBurst.explode();

        this.tweens.add({ targets: core, scale: 4.8, alpha: 0, duration: 280, onComplete: () => core.destroy() });
        this.tweens.add({ targets: shock, scale: 3.9, alpha: 0, duration: 560, ease: 'Cubic.easeOut', onComplete: () => shock.destroy() });
        this.tweens.add({ targets: shock2, scale: 5.2, alpha: 0, duration: 680, ease: 'Cubic.easeOut', onComplete: () => shock2.destroy() });

        if (this.rabbit && this.rabbit.active) {
            this.tweens.killTweensOf(this.rabbit);
            this.tweens.add({
                targets: this.rabbit,
                scaleX: 1.35,
                scaleY: 1.35,
                alpha: 0.9,
                duration: 90,
                yoyo: true,
                ease: 'Back.easeOut'
            });
            this.tweens.add({
                targets: this.rabbit,
                scaleX: 0.18,
                scaleY: 0.18,
                alpha: 0,
                angle: 24,
                duration: 430,
                delay: 80,
                ease: 'Cubic.easeIn',
                onComplete: () => {
                    if (this.rabbit && this.rabbit.active) this.rabbit.destroy();
                    this.rabbit = null;
                }
            });
        }

        this.hudTitle.setText('WIZARD WEASEL — FASE FINAL!');
        this.hudTitle.setFill('#ff1744');
        this.updateHpBar(this.bossHP, this.bossMaxHP, 0xff1744);

        // Boost permanente: todos os danos do Gator contra o boss passam a valer 2x.
        this.playerDamageMultiplier = 2;
        this.phase4RageActive = true;

        // Filtro vermelho sutil da fase final.
        if (!this.phase4RedOverlay) {
            this.phase4RedOverlay = this.add.rectangle(400, 300, 800, 600, 0xd50000, 0)
                .setDepth(130)
                .setScrollFactor(0);
        }
        this.tweens.add({
            targets: this.phase4RedOverlay,
            alpha: 0.115,
            duration: 900,
            ease: 'Sine.easeOut'
        });
        this.tweens.add({
            targets: this.phase4RedOverlay,
            alpha: 0.135,
            duration: 1100,
            yoyo: true,
            repeat: -1,
            ease: 'Sine.easeInOut'
        });

        // A mensagem fica acima do Gator e pulsa junto com a entrada da fase final.
        Sound.rageGrow();
        const rageText = this.add.text(this.player.x, this.player.y - 76, 'sua raiva cresce!', {
            fontFamily: '"Press Start 2P"',
            fontSize: '15px',
            fill: '#ff5252',
            stroke: '#250000',
            strokeThickness: 5
        }).setOrigin(0.5).setDepth(176).setScale(0.65).setAlpha(0);
        this.phase4RageText = rageText;
        this.tweens.add({
            targets: rageText,
            alpha: 1,
            scale: 1.08,
            y: this.player.y - 92,
            duration: 320,
            ease: 'Back.easeOut'
        });
        this.tweens.add({
            targets: rageText,
            y: this.player.y - 125,
            alpha: 0,
            scale: 1.18,
            duration: 1200,
            delay: 900,
            ease: 'Cubic.easeIn',
            onComplete: () => {
                if (rageText && rageText.active) rageText.destroy();
                if (this.phase4RageText === rageText) this.phase4RageText = null;
            }
        });

        const aura = this.add.circle(this.player.x, this.player.y, 34, 0xff1744, 0)
            .setStrokeStyle(3, 0xff4040, 0.9)
            .setDepth(19);
        this.phase4RageAura = aura;
        this.tweens.add({
            targets: aura,
            scale: 1.65,
            alpha: 0,
            duration: 1300,
            ease: 'Cubic.easeOut',
            onComplete: () => {
                if (aura && aura.active) aura.destroy();
                if (this.phase4RageAura === aura) this.phase4RageAura = null;
            }
        });

        // Pequena espera para a explosão terminar antes do retorno do boss.
        this.time.delayedCall(620, () => {
            if (this.isDead || this.bossPhase !== 4 || !this.boss) return;

            this.boss.setActive(true);
            this.boss.setVisible(true);
            this.bossEntranceAnimating = true;
            this.boss.setAlpha(0);
            this.boss.clearTint();
            this.boss.setScale(0.78);
            this.boss.setPosition(760, -120);
            if (this.bossHitbox) {
                this.bossHitbox.setActive(true);
                this.bossHitbox.body.enable = true;
                this.bossHitbox.setPosition(this.boss.x, this.boss.y);
            }

            const entranceFlash = this.add.circle(620, 100, 32, 0xff1744, 0.18).setDepth(160);
            this.tweens.add({ targets: entranceFlash, scale: 3.8, alpha: 0, duration: 700, onComplete: () => entranceFlash.destroy() });
            Sound.phaseChange();
            this.cameras.main.shake(180, 0.012);

            // O novo padrão mistura os deslocamentos suaves das Fases 1 e 2, acelerados.
            this.tweens.add({
                targets: this.boss,
                x: 620,
                y: 245,
                alpha: 1,
                scale: 1,
                duration: 720,
                ease: 'Back.easeOut',
                onComplete: () => {
                    this.bossEntranceAnimating = false;
                    this.startFinalBossMovement();
                }
            });

            if (this.bossShootTimer) this.bossShootTimer.remove();
            this.shotCount = 0;
            this.bossShootTimer = this.time.addEvent({ delay: 650, callback: this.fireBossOrb, callbackScope: this, loop: true });
        });
    }

    startFinalBossMovement() {
        if (this.isDead || this.bossPhase !== 4 || !this.boss || !this.boss.active) return;
        this.bossMoveGeneration++;
        const generation = this.bossMoveGeneration;
        if (this.bossMoveTimer) { this.bossMoveTimer.remove(); this.bossMoveTimer = null; }
        this.tweens.killTweensOf(this.boss);
        this.bossIsMoving = false;

        const moveAgain = () => {
            if (this.isDead || this.bossPhase !== 4 || !this.boss || !this.boss.active) return;
            if (this.bossMoveGeneration !== generation) return;

            const style = this.shotCount % 2 === 0 ? 1 : 2;
            const minX = 115, maxX = 700;
            const minY = style === 1 ? 155 : 125;
            const maxY = style === 1 ? 410 : 440;
            let targetX = Phaser.Math.Between(minX, maxX);
            let targetY = Phaser.Math.Between(minY, maxY);
            let tries = 0;
            while (Phaser.Math.Distance.Between(this.boss.x, this.boss.y, targetX, targetY) < 120 && tries < 8) {
                targetX = Phaser.Math.Between(minX, maxX);
                targetY = Phaser.Math.Between(minY, maxY);
                tries++;
            }

            this.bossIsMoving = true;
            const duration = style === 1
                ? Phaser.Math.Between(360, 560)   // padrão da Fase 1, acelerado
                : Phaser.Math.Between(270, 450);  // padrão da Fase 2, ainda mais rápido
            const ease = style === 1 ? 'Sine.easeInOut' : 'Cubic.easeInOut';

            this.tweens.add({
                targets: this.boss,
                x: targetX,
                y: targetY,
                duration,
                ease,
                onComplete: () => {
                    if (this.bossMoveGeneration !== generation || this.bossPhase !== 4 || this.isDead) return;
                    this.bossIsMoving = false;
                    this.bossMoveTimer = this.time.delayedCall(70 + Phaser.Math.Between(0, 120), moveAgain, [], this);
                }
            });
        };
        moveAgain();
    }

    handleCarouselPlatformLanding(player, platform) {
        if (!player || !platform || this.dropThroughPlatform) return;
        if (player.body && player.body.velocity.y >= 0) this.jumpsLeft = 2;
    }

    processCarouselPlatformCollision(player, platform) {
        if (!player || !player.body || !platform || !platform.body) return false;
        if (this.dropThroughPlatform && this.time.now < this.dropThroughUntil) return false;
        const falling = player.body.velocity.y >= 0;
        if (!falling) return false;
        return player.body.bottom <= platform.body.top + 10;
    }

    tryDropThroughCarouselPlatform() {
        if (this.bossPhase !== 1 || !this.player || !this.player.body) return false;
        if (this.dropThroughPlatform) return false;
        const pb = this.player.body;
        const playerBottom = pb.bottom, playerLeft = pb.left, playerRight = pb.right;
        let standingOnPlatform = false;
        if (this.carouselPlatforms) {
            this.carouselPlatforms.getChildren().some((platform) => {
                if (!platform || !platform.active || !platform.body) return false;
                const body = platform.body;
                const horizontalOverlap = playerRight > body.left + 4 && playerLeft < body.right - 4;
                const onTop = Math.abs(playerBottom - body.top) <= 8;
                if (horizontalOverlap && onTop) { standingOnPlatform = true; return true; }
                return false;
            });
        }
        if (!standingOnPlatform) return false;
        this.dropThroughPlatform = true;
        this.dropThroughUntil = this.time.now + 260;
        if (this.carouselCollider) this.carouselCollider.active = false;
        this.player.y += 7;
        this.player.setVelocityY(90);
        this.jumpsLeft = Math.max(0, this.jumpsLeft - 1);
        this.time.delayedCall(270, () => {
            this.dropThroughPlatform = false;
            if (this.bossPhase === 1 && this.carouselCollider) this.carouselCollider.active = true;
        });
        return true;
    }

    update(time) {
        if (this.isDead) return;

        // Pause fica totalmente fora da lógica de combate.
        if (!this.gamePaused && !this.preBattleCountdown &&
            (Phaser.Input.Keyboard.JustDown(this.pauseKeyEsc) || Phaser.Input.Keyboard.JustDown(this.pauseKeyP))) {
            this.openPauseMenu();
            return;
        }
        if (this.gamePaused) {
            this.handlePauseInput();
            return;
        }
        if (this.preBattleCountdown) return;
        if (this.boss && this.bossHitbox && this.boss.active && this.bossHitbox.active) {
            this.bossHitbox.setPosition(this.boss.x, this.boss.y);
        }
        if (this.boss && this.boss.active) {
            const dtBoss = Math.min((this.game.loop.delta || 16.67) / 1000, 0.05);
            this.bossAnimTime = (this.bossAnimTime || 0) + dtBoss;
            this.bossCastPulse = Math.max(0, (this.bossCastPulse || 0) - dtBoss);
            const idleWave = Math.sin(this.bossAnimTime * 5.0);
            const castBoost = this.bossCastPulse > 0 ? (this.bossCastPulse / 0.32) : 0;
            if (!this.bossHitReacting && !this.bossEntranceAnimating) {
                this.boss.setScale(1 + idleWave * 0.018 + castBoost * 0.075, 1 - idleWave * 0.018 - castBoost * 0.055);
            }
            this.boss.setAngle(idleWave * 1.6 + castBoost * 4.0);
        }
        if (this.rabbit && this.rabbit.active && this.bossPhase === 3) {
            const dtRabbit = Math.min((this.game.loop.delta || 16.67) / 1000, 0.033);
            this.rabbitBobbingTime = (this.rabbitBobbingTime || 0) + dtRabbit;

            this.rabbitVY += this.rabbitGravity * dtRabbit;
            this.rabbit.x += this.rabbitVX * dtRabbit;
            this.rabbit.y += this.rabbitVY * dtRabbit;

            if (this.rabbit.x <= this.rabbitLeftX) {
                this.rabbit.x = this.rabbitLeftX;
                this.rabbitVX = Math.abs(this.rabbitVX);
                this.rabbit.setFlipX(false);
            } else if (this.rabbit.x >= this.rabbitRightX) {
                this.rabbit.x = this.rabbitRightX;
                this.rabbitVX = -Math.abs(this.rabbitVX);
                this.rabbit.setFlipX(true);
            }

            if (this.rabbit.y >= this.rabbitFloorY) {
                this.rabbit.y = this.rabbitFloorY;
                this.rabbitVY = -Math.abs(this.rabbitVY) * this.rabbitBounce;
            } else if (this.rabbit.y <= this.rabbitCeilingY) {
                this.rabbit.y = this.rabbitCeilingY;
                this.rabbitVY = Math.abs(this.rabbitVY) * 0.78;
            }

            const rw = Math.sin(this.rabbitBobbingTime * 7.0);
            const squash = Math.min(1, Math.abs(this.rabbitVY) / 700);
            this.rabbit.setScale(1 + rw * 0.012 + squash * 0.025, 1 - rw * 0.018 - squash * 0.02);
            this.rabbit.setAngle(rw * 1.4);

            if (this.rabbitHitbox && this.rabbitHitbox.active) {
                this.rabbitHitbox.setPosition(this.rabbit.x, this.rabbit.y);
                this.rabbitHitbox.setFlipX(this.rabbit.flipX);
            }
        }
        if (this.bossPhase === 1 && this.carouselPlatforms && this.carouselPlatforms.getChildren().length > 0) {
            const dt = Math.min((this.game.loop.delta || 16.67) / 1000, 0.05);
            this.carouselAngle += this.carouselSpeed * dt;
            this.carouselPlatforms.getChildren().forEach((platform) => {
                if (!platform || !platform.active || !platform.body) return;
                const a = this.carouselAngle + (platform.carouselIndex * (Math.PI * 2 / this.carouselPlatformCount));
                platform.setVelocity(
                    -Math.sin(a) * this.carouselRadiusX * this.carouselSpeed,
                     Math.cos(a) * this.carouselRadiusY * this.carouselSpeed
                );
            });
        }
        if (this.player && this.parryHitbox && this.parryHitbox.active) this.parryHitbox.setPosition(this.player.x, this.player.y);
        if (this.phase4RageText && this.phase4RageText.active && this.phase4RageText.alpha > 0.02) {
            this.phase4RageText.x = this.player.x;
        }
        if (this.phase4RageAura && this.phase4RageAura.active) {
            this.phase4RageAura.setPosition(this.player.x, this.player.y);
        }
        this.playerShadow.x = this.player.x;
        if (this.player) {
            if (this.isParrying) this.player.setTint(0xff4081);
            else if (this.isDashing) this.player.setTint(0x63c7ff);
            else if (this.dashRecovery) this.player.setTint(0x72aee8);
            else if (!this.konamiImmortal && !this.__rainbow) this.player.clearTint();
            else if (this.konamiImmortal && !this.__rainbow) this.player.setTint(0x79ffb0);
        }
        if (this.konamiImmortal && this.immortalHud) {
            this.immortalHud.setAlpha(0.92 + Math.sin(time * 0.008) * 0.08);
        }
        if (this.boss && this.bossGlow) {
            this.bossGlow.setPosition(this.boss.x, this.boss.y);
            this.bossGlowRing.setPosition(this.boss.x, this.boss.y);
            if (this.bossMagicCore) this.bossMagicCore.setPosition(this.boss.x - 28, this.boss.y - 3);
            const phaseGlow = this.bossPhase === 1 ? 0x8e24aa : this.bossPhase === 2 ? 0xff4081 : this.bossPhase === 3 ? 0xffab00 : 0x00e5ff;
            this.bossGlow.setTint(phaseGlow);
            this.bossGlowRing.setStrokeStyle(2, phaseGlow, 0.35);
        }
        if (this.playerDashMist) {
            this.playerDashMist.setPosition(this.player.x, this.player.y);
            if (!this.dashRecovery && !this.isDashing) this.playerDashMist.setAlpha(0);
        }
        if (this.playerMagicGlow) {
            this.playerMagicGlow.setPosition(this.player.x, this.player.y);
            this.playerMagicGlow.setAlpha(this.isDashing ? 0.85 : this.isParrying ? 0.65 : 0.18);
            this.playerMagicGlow.setStrokeStyle(2, this.isParrying ? 0xff4081 : 0x00e5ff, this.isParrying ? 0.7 : 0.28);
        }
        let pHeight = 550 - this.player.y;
        this.playerShadow.scaleX = Math.max(0.3, 1 - (pHeight / 400));
        let moveLeft = this.cursors.left.isDown || this.keyLeft.isDown || this.keyA.isDown;
        let moveRight = this.cursors.right.isDown || this.keyRight.isDown || this.keyD.isDown;
        let isMoving = false;
        if (this.isDashing) {
            let dashSpeed = this.facing === 'right' ? 850 : -850;
            this.player.setVelocityX(dashSpeed);
            this.player.setVelocityY(0);
            let shadow = this.add.sprite(this.player.x, this.player.y, 'gator_idle').setTint(0x00e5ff).setAlpha(0.5).setFlipX(this.facing === 'left');
            this.tweens.add({ targets: shadow, alpha: 0, duration: 200, onComplete: () => shadow.destroy() });
            return;
        }
        const moveSpeed = this.dashRecovery ? 115 : 290;
        if (moveLeft) { this.player.setVelocityX(-moveSpeed); this.facing = 'left'; this.player.setFlipX(true); isMoving = true; }
        else if (moveRight) { this.player.setVelocityX(moveSpeed); this.facing = 'right'; this.player.setFlipX(false); isMoving = true; }
        else this.player.setVelocityX(0);
        if (this.bossPhase === 1 && !this.dropThroughPlatform && this.carouselPlatforms && this.player && this.player.body && this.player.body.velocity.y >= 0) {
            const pb = this.player.body;
            for (const platform of this.carouselPlatforms.getChildren()) {
                if (!platform || !platform.active || !platform.body) continue;
                const b = platform.body;
                const overlapX = pb.right > b.left + 5 && pb.left < b.right - 5;
                const nearTop = Math.abs(pb.bottom - b.top) <= 9;
                if (overlapX && nearTop) { this.jumpsLeft = 2; break; }
            }
        }
        let jumpPressed = Phaser.Input.Keyboard.JustDown(this.cursors.up) || Phaser.Input.Keyboard.JustDown(this.keyJump) || Phaser.Input.Keyboard.JustDown(this.keyW);
        if (jumpPressed && this.jumpsLeft > 0) {
            this.player.setVelocityY(-500);
            this.jumpsLeft--;
            if (this.jumpsLeft === 1) Sound.jump();
            else Sound.doubleJump();
            this.tweens.killTweensOf(this.player);
            this.player.setScale(1.08, 0.90);
            this.tweens.add({ targets: this.player, scaleX: 0.98, scaleY: 1.03, duration: 120, ease: 'Back.easeOut' });
            this.cameras.main.shake(55, 0.0018);
            if (this.jumpsLeft === 0) {
                let pRing = this.add.circle(this.player.x, this.player.y + 15, 20, 0x00e5ff, 0.6);
                this.tweens.add({ targets: pRing, scale: 2, alpha: 0, duration: 250, onComplete: () => pRing.destroy() });
            }
        }
        const downPressed = Phaser.Input.Keyboard.JustDown(this.cursors.down) || Phaser.Input.Keyboard.JustDown(this.keyDown) || Phaser.Input.Keyboard.JustDown(this.keyS);
        if (downPressed) this.tryDropThroughCarouselPlatform();
        let dashPressed = Phaser.Input.Keyboard.JustDown(this.keyDash) || Phaser.Input.Keyboard.JustDown(this.dashKey1) || Phaser.Input.Keyboard.JustDown(this.dashKey2);
        if (dashPressed && !this.dashCooldown) this.executeDash();
        let isShooting = this.keyShoot.isDown || this.shootKey1.isDown || this.shootKey2.isDown;
        const onGround = !!(this.player.body && this.player.body.touching.down);
        const animTick = Math.floor(time / 100) % 2;
        if (isShooting) {
            if (isMoving && onGround) this.player.setTexture(animTick === 0 ? 'gator_runshoot1' : 'gator_runshoot2');
            else this.player.setTexture('gator_shoot');
            if (time > this.lastShootTime) { this.shootCardWand(); this.lastShootTime = time + 110; }
        } else if (isMoving && onGround) {
            this.player.setTexture(animTick === 0 ? 'gator_run1' : 'gator_run2');
        } else this.player.setTexture('gator_idle');
        if ((Phaser.Input.Keyboard.JustDown(this.keyParry) || Phaser.Input.Keyboard.JustDown(this.parryKey)) && !this.isParrying) {
            this.executeParryAttempt();
        }
        if (Phaser.Input.Keyboard.JustDown(this.keySpecial) || Phaser.Input.Keyboard.JustDown(this.specialKey)) {
            this.useSpecial();
        }
        if (this.boss && this.boss.active && !this.isDead && (this.bossPhase === 1 || this.bossPhase === 2 || this.bossPhase === 4)) {
            this.playerBullets.children.iterate((b) => {
                if (!b || !b.active) return;
                if (Phaser.Math.Distance.Between(b.x, b.y, this.boss.x, this.boss.y) <= 48) this.hitBossWithBullet(b, this.bossHitbox);
            });
        }
        // Hit detection manual do coelho: não depende do Arcade overlap.
        if (this.bossPhase === 3 && this.rabbit && this.rabbit.active && !this.isDead) {
            this.playerBullets.children.iterate((b) => {
                if (!b || !b.active) return;
                const dx = Math.abs(b.x - this.rabbit.x);
                const dy = Math.abs(b.y - this.rabbit.y);
                if (dx <= 64 && dy <= 86) this.hitRabbitWithBullet(b, this.rabbitHitbox);
            });
        }

        this.playerBullets.children.iterate((b) => { if (b && (b.x > 840 || b.x < -40)) b.destroy(); });
        this.carrots.children.iterate((c) => {
            if (c && (c.x < -40 || c.x > 840 || c.y < -40 || c.y > 640)) c.destroy();
        });
        this.bossOrbs.children.iterate((orb) => {
            if (orb && (orb.x < -40 || orb.x > 840 || orb.y < -40 || orb.y > 640)) {
                if (orb.particles) orb.particles.destroy();
                orb.destroy();
            }
        });
    }

    executeDash() {
        this.isDashing = true;
        this.dashCooldown = true;
        this.dashRecovery = false;
        Sound.dash();
        this.cameras.main.shake(100, 0.005);
        this.time.delayedCall(240, () => {
            this.isDashing = false;
            this.dashRecovery = true;
            if (this.playerDashMist) {
                this.playerDashMist.setPosition(this.player.x, this.player.y);
                this.playerDashMist.setFillStyle(0x4dabff, 0.16);
                this.playerDashMist.setStrokeStyle(2, 0x75c8ff, 0.45);
                this.tweens.add({ targets: this.playerDashMist, scale: 1.35, alpha: 0, duration: 500, ease: 'Sine.easeOut',
                    onComplete: () => { this.playerDashMist.setAlpha(0); this.playerDashMist.setScale(1); } });
            }
            this.time.delayedCall(500, () => { this.dashRecovery = false; });
        });
        this.time.delayedCall(600, () => { this.dashCooldown = false; });
    }

    shootCardWand() {
        let spawnX = this.facing === 'right' ? this.player.x + 28 : this.player.x - 28;
        let spawnY = this.player.y - 2;
        let card = this.playerBullets.create(spawnX, spawnY, 'card_bullet');
        card.setVelocityX(this.facing === 'right' ? 750 : -750);
        card.setAngularVelocity(this.facing === 'right' ? 600 : -600);
        let spark = this.add.circle(spawnX, spawnY, 6, 0xffd700, 0.9);
        this.tweens.add({ targets: spark, scale: 2.2, alpha: 0, duration: 120, onComplete: () => spark.destroy() });
        Sound.shoot();
        this.cameras.main.shake(28, 0.0012);
    }

    executeParryAttempt() {
        const parryWindow = 1000;
        this.isParrying = true;
        this.player.setTint(0xff4081);
        if (this.parryHitbox) {
            this.parryHitbox.setPosition(this.player.x, this.player.y);
            this.parryHitbox.setActive(true);
            this.parryHitbox.body.enable = true;
            this.parryHitbox.body.setSize(150, 150, true);
        }
        let aura = this.add.circle(this.player.x, this.player.y, 35, 0xff4081, 0.5);
        this.tweens.add({ targets: aura, scale: 1.5, alpha: 0, duration: parryWindow, onComplete: () => aura.destroy() });
        this.time.delayedCall(parryWindow, () => {
            this.isParrying = false;
            if (this.parryHitbox) { this.parryHitbox.setActive(false); this.parryHitbox.body.enable = false; }
            if (this.player.active && !this.isDashing) {
                if (this.dashRecovery) this.player.setTint(0x72aee8);
                else this.player.clearTint();
            }
        });
    }

    applyBossDamage(amount) {
        if (!this.boss || !this.boss.active || this.isDead || this.bossHP <= 0) return;
        if (this.playerDamageMultiplier && this.playerDamageMultiplier !== 1) {
            amount *= this.playerDamageMultiplier;
        }
        if (this.__godboss) { if (this.bossHP <= 1) return; amount = Math.min(amount, Math.max(0, this.bossHP - 1)); }
        this.bossHP -= amount;
        if (this.bossHP < 0) this.bossHP = 0;
        this.updateHpBar(this.bossHP, this.bossMaxHP);
        if (this.bossPhase === 1 && this.bossHP <= 2450) this.transitionToPhase2();
        else if (this.bossPhase === 2 && this.bossHP <= 1400) this.transitionToPhase3();
        else if (this.bossHP <= 0) this.defeatBoss();
    }

    hitBossWithBullet(bullet, bossHitbox) {
        if (!bullet || !bullet.active || !bossHitbox || !bossHitbox.active || !this.boss || !this.boss.active) return;
        bullet.destroy();
        if (!this.specialReady) {
            this.specialHits = Math.min(this.specialRequired, this.specialHits + 1);
            if (this.specialHits >= this.specialRequired) this.specialReady = true;
            this.updateSpecialMeter();
        }
        this.applyBossDamage(15);
        Sound.hitBoss();
        this.boss.setTint(0xff8888);
        this.cameras.main.shake(45, 0.0022);
        this.bossHitReacting = true;
        this.boss.setScale(1.10, 0.92);
        this.tweens.add({ targets: this.boss, scaleX: 0.98, scaleY: 1.03, duration: 90, ease: 'Back.easeOut' });
        this.time.delayedCall(100, () => {
            this.bossHitReacting = false;
            if (this.boss && this.boss.active) this.boss.clearTint();
        });
    }

    useSpecial() {
        if (!this.specialReady || this.isDead || !this.boss || !this.boss.active) return;
        if (this.bossPhase === 3) return;
        this.specialReady = false;
        this.specialHits = 0;
        this.updateSpecialMeter();
        Sound.specialCast();
        const x = this.boss.x, targetY = this.boss.y;
        const card = this.add.image(x, targetY - 190, 'giant_card').setDepth(160).setScale(0.42);
        card.setAngle(-8);
        const trail = this.add.circle(x, targetY - 145, 22, 0xffd54f, 0.18).setDepth(155);
        this.tweens.add({ targets: trail, scale: 2.8, alpha: 0, duration: 520, ease: 'Cubic.easeOut', onComplete: () => trail.destroy() });
        this.cameras.main.shake(120, 0.004);
        this.tweens.add({ targets: card, y: targetY - 58, scale: 1.05, angle: 0, duration: 520, ease: 'Cubic.easeIn',
            onComplete: () => {
                if (!card.active) return;
                Sound.specialExplode();
                const flash = this.add.circle(x, targetY, 30, 0xffffff, 0.95).setDepth(165);
                const ring = this.add.circle(x, targetY, 20, 0xffd54f, 0).setStrokeStyle(5, 0xffd54f, 1).setDepth(164);
                const burst = this.add.particles(x, targetY, 'card_bullet', {
                    speed: { min: 140, max: 430 }, scale: { start: 1.2, end: 0 }, lifespan: 550, quantity: 22,
                    tint: [0xffd54f, 0xff1744, 0xffffff], emitting: false }).setDepth(166);
                burst.explode();
                this.tweens.add({ targets: flash, scale: 4.2, alpha: 0, duration: 260, onComplete: () => flash.destroy() });
                this.tweens.add({ targets: ring, scale: 3.4, alpha: 0, duration: 380, onComplete: () => ring.destroy() });
                this.cameras.main.shake(260, 0.014);
                const specialDamage = 100 * (this.playerDamageMultiplier || 1);
                const txt = this.add.text(x, targetY - 55, `★ ESPECIAL! -${specialDamage} ★`, {
                    fontFamily: '"Press Start 2P"', fontSize: '14px', fill: '#ffd54f', stroke: '#000000', strokeThickness: 4
                }).setOrigin(0.5).setDepth(170);
                this.tweens.add({ targets: txt, y: targetY - 100, alpha: 0, duration: 700, onComplete: () => txt.destroy() });
                this.applyBossDamage(100);
                card.destroy();
            }});
    }

    hitRabbitWithBullet(bullet, rabbitHitbox) {
        if (!bullet || !bullet.active || !this.rabbit || !this.rabbit.active || this.bossPhase !== 3) return;
        bullet.destroy();

        this.rabbitHP -= 16;
        if (this.rabbitHP < 0) this.rabbitHP = 0;
        this.updateHpBar(this.rabbitHP, this.rabbitMaxHP, 0xffab00);
        Sound.hitRabbit();

        // Feedback visual curto de dano, sem alterar active/visible.
        this.rabbit.setTint(0xff8888);
        this.cameras.main.shake(70, 0.004);
        this.tweens.add({
            targets: this.rabbit,
            scaleX: '+=0.06',
            scaleY: '-=0.04',
            duration: 55,
            yoyo: true,
            ease: 'Sine.easeOut'
        });
        this.time.delayedCall(70, () => {
            if (this.rabbit && this.rabbit.active) {
                this.rabbit.clearTint();
                this.rabbit.setVisible(true);
                this.rabbit.setAlpha(1);
            }
        });

        if (this.rabbitHP <= 0) {
            this.transitionToPhase4();
        }
    }

    handleParryOrbCollision(parryHitbox, orb) {
        if (!orb || !orb.active || !this.isParrying) return;
        if (!orb.isPink) return;
        if (orb.particles) orb.particles.destroy();
        orb.destroy();
        Sound.parry();
        this.player.setVelocityY(-550);
        this.jumpsLeft = 1;
        this.cameras.main.shake(200, 0.015);
        let txt = this.add.text(this.player.x, this.player.y - 35, '★ PARRY! ★', {
            fontFamily: '"Press Start 2P"', fontSize: '16px', fill: '#ff4081', stroke: '#ffffff', strokeThickness: 4
        }).setOrigin(0.5);
        this.tweens.add({ targets: txt, y: '-=45', alpha: 0, duration: 550, onComplete: () => txt.destroy() });
        if (this.bossPhase !== 3) {
            this.applyBossDamage(180);
        }
    }

    handlePlayerOrbCollision(player, orb) {
        if (!orb.active) return;
        if (this.isParrying) return;
        if (this.isDashing) return;
        if (this.__noclip) return;
        this.playerDeath();
    }

    handlePlayerCarrotCollision(player, carrot) {
        if (!carrot.active || this.isDashing) return;
        if (this.__noclip) return;
        carrot.destroy();
        this.playerDeath();
    }

    playerDeath() {
        if (this.konamiImmortal || this.__noclip) {
            this.player.setTint(0x79ffb0);
            this.cameras.main.flash(120, 0, 255, 160);
            this.time.delayedCall(140, () => {
                if (this.player && this.player.active && !this.isDashing) this.player.clearTint();
            });
            return;
        }
        if (this.isDead) return;
        this.isDead = true;
        this.stopBossDynamicMovement();
        if (this.bossShootTimer) { this.bossShootTimer.remove(); this.bossShootTimer = null; }
        if (this.rabbitShootTimer) { this.rabbitShootTimer.remove(); this.rabbitShootTimer = null; }
        this.isDashing = false;
        this.dashRecovery = false;
        this.isParrying = false;
        if (this.parryHitbox) { this.parryHitbox.setActive(false); this.parryHitbox.body.enable = false; }
        Sound.playerDeath();
        this.cameras.main.shake(400, 0.03);
        this.player.setTint(0xff1744);
        this.physics.pause();
        this.player.body.allowGravity = true;
        this.player.setVelocity(0, -480);
        this.time.delayedCall(1500, () => { this.scene.start('GameOverScene', { won: false, introAlreadySeen: true }); });
    }

    defeatBoss() {
        this.isDead = true;
        this.stopBossDynamicMovement();
        if (this.bossShootTimer) { this.bossShootTimer.remove(); this.bossShootTimer = null; }
        if (this.bossHitbox) this.bossHitbox.setActive(false);
        if (this.parryHitbox) { this.parryHitbox.setActive(false); this.parryHitbox.body.enable = false; }
        this.physics.pause();
        Sound.bossDefeat();
        this.cameras.main.shake(600, 0.03);
        this.boss.setTint(0x333333);
        let emitter = this.add.particles(this.boss.x, this.boss.y, 'card_bullet', {
            speed: { min: 100, max: 400 }, scale: { start: 1, end: 0 }, lifespan: 800, quantity: 50 });
        emitter.explode();
        this.time.delayedCall(1500, () => { this.scene.start('GameOverScene', { won: true }); });
    }
}

// ==========================================
// SCENE: GAME OVER / VITÓRIA
// ==========================================
class GameOverScene extends Phaser.Scene {
    constructor() { super({ key: 'GameOverScene' }); }
    init(data) { this.won = data.won || false; }
    create() {
        this.add.rectangle(400, 300, 800, 600, this.won ? 0x021a0d : 0x1a0508);
        let titleTxt = this.won ? 'KNOCKOUT!' : 'YOU DIED';
        let color = this.won ? '#00e676' : '#ff1744';
        let title = this.add.text(400, 220, titleTxt, {
            fontFamily: '"Press Start 2P"', fontSize: '42px', fill: color, stroke: '#000000', strokeThickness: 8
        }).setOrigin(0.5);
        this.tweens.add({ targets: title, scale: 1.08, duration: 600, yoyo: true, loop: -1 });
        this.add.text(400, 320, this.won ? 'O Circo é seu! Mestre Absoluto!' : 'Use o Dash [SHIFT] e Pulo Duplo para escapar!', {
            fontFamily: '"Press Start 2P"', fontSize: '10px', fill: '#ffffff'
        }).setOrigin(0.5);
        let rest = this.add.text(400, 440, 'PRESSIONE ESPAÇO PARA REINICIAR', {
            fontFamily: '"Press Start 2P"', fontSize: '12px', fill: '#ffd700'
        }).setOrigin(0.5);
        this.tweens.add({ targets: rest, alpha: 0.2, duration: 500, yoyo: true, loop: -1 });
        const restart = () => {
            Sound.menuSelect();
            this.scene.start('GameScene', { konamiImmortal: false, fromIntro: false, restartAfterDeath: true });
        };
        this.input.keyboard.once('keydown-SPACE', restart);
        this.input.keyboard.once('keydown-ENTER', restart);
    }
}

// ==========================================
// CONFIGURAÇÃO PHASER 3
// ==========================================
const config = {
    type: Phaser.AUTO,
    width: 800,
    height: 600,
    parent: 'game-container',
    pixelArt: true,
    physics: {
        default: 'arcade',
        arcade: { gravity: { y: 0 }, debug: false }
    },
    scene: [MenuScene, IntroCutsceneScene, GameScene, GameOverScene]
};

const PhaserGame = new Phaser.Game(config);
</script>
