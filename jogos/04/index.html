<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captus Gator vs Wizard Weasel - Enhanced Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #08030c;
            color: #fff;
            font-family: 'Press Start 2P', cursive;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            flex-direction: column;
        }
        #game-wrapper {
            position: relative;
            box-shadow: 0 0 40px rgba(255, 23, 68, 0.4), 0 0 0 10px #1a0a2a, 0 0 0 16px #08030c;
            border-radius: 8px;
            overflow: hidden;
        }
        #game-wrapper::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.3) 50%),
                        linear-gradient(90deg, rgba(255,0,0,0.03), rgba(0,255,0,0.01), rgba(0,0,255,0.03));
            z-index: 10;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }
        #game-container {
            width: 800px;
            height: 600px;
            background-color: #000;
        }

        /* ============================================
           CONSOLE SECRETO DE DESENVOLVEDOR
           ============================================ */
        #dev-console {
            position: fixed;
            top: 0; left: 0;
            width: 100vw;
            height: 45vh;
            background: linear-gradient(180deg, rgba(3, 8, 3, 0.97) 0%, rgba(0, 0, 0, 0.97) 100%);
            color: #0f0;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            z-index: 99999;
            display: none;
            flex-direction: column;
            border-bottom: 2px solid #0f0;
            box-shadow: 0 0 40px rgba(0, 255, 0, 0.35);
            animation: consoleSlideIn 0.18s ease-out;
        }
        #dev-console.visible { display: flex; }
        @keyframes consoleSlideIn {
            from { transform: translateY(-100%); opacity: 0; }
            to   { transform: translateY(0); opacity: 1; }
        }
        #dev-console-header {
            background: #0a1a0a;
            border-bottom: 1px solid #0f0;
            padding: 6px 12px;
            font-size: 11px;
            color: #0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            letter-spacing: 1px;
            /* Fonte principal restaurada: Press Start 2P */
    font-family: 'Press Start 2P', monospace;
        }
        #dev-console-header .title { color: #0f0; text-shadow: 0 0 8px rgba(0,255,0,0.7); }
        #dev-console-header .hint { color: #6f6; font-size: 9px; }
        #dev-console-output {
            flex: 1;
            overflow-y: auto;
            padding: 10px 14px;
            white-space: pre-wrap;
            line-height: 1.5;
            scrollbar-width: thin;
            scrollbar-color: #0f0 #000;
        }
        #dev-console-output::-webkit-scrollbar { width: 8px; }
        #dev-console-output::-webkit-scrollbar-track { background: #000; }
        #dev-console-output::-webkit-scrollbar-thumb { background: #0f0; }
        #dev-console-output .line-echo  { color: #0ff; }
        #dev-console-output .line-ok    { color: #0f0; }
        #dev-console-output .line-warn  { color: #ff0; }
        #dev-console-output .line-error { color: #f44; }
        #dev-console-output .line-info  { color: #8f8; }
        #dev-console-output .line-sys   { color: #f0f; }
        #dev-console-input-row {
            display: flex;
            align-items: center;
            border-top: 1px solid #0f0;
            background: #000;
            padding: 6px 10px;
        }
        #dev-console-prompt {
            color: #0f0;
            margin-right: 8px;
            font-weight: bold;
            text-shadow: 0 0 6px rgba(0,255,0,0.8);
        }
        #dev-console-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #0f0;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            caret-color: #0f0;
        }
        #dev-console-input::placeholder { color: #0a5a0a; }
        #dev-console-badge {
            position: fixed;
            top: 6px;
            left: 6px;
            background: rgba(0, 20, 0, 0.85);
            color: #0f0;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            padding: 3px 8px;
            border: 1px solid #0f0;
            border-radius: 3px;
            z-index: 99998;
            display: none;
            letter-spacing: 1px;
            text-shadow: 0 0 6px rgba(0,255,0,0.9);
            animation: pulseBadge 1.6s ease-in-out infinite;
        }
        #dev-console-badge.visible { display: block; }
        @keyframes pulseBadge {
            0%, 100% { opacity: 0.85; }
            50%      { opacity: 1; }
        }

        /* Badge de áudio */
        #audio-badge {
            position: fixed;
            top: 6px;
            right: 6px;
            background: rgba(20, 0, 30, 0.85);
            color: #ffd54f;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            padding: 3px 8px;
            border: 1px solid #ffd54f;
            border-radius: 3px;
            z-index: 99998;
            display: none;
            letter-spacing: 1px;
            cursor: pointer;
        }
        #audio-badge.visible { display: block; }
        #audio-badge.muted { color: #f44; border-color: #f44; }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <div id="game-container"></div>
    </div>

    <!-- ============================================================
         CONSOLE SECRETO DE DESENVOLVEDOR — só aparece com F12
         ============================================================ -->
    <div id="dev-console-badge">[ DEV MODE ON ]</div>
    <div id="audio-badge" title="Clique para mutar/desmutar">🔊 [M] SOM ON</div>
    <div id="dev-console" aria-hidden="true">
        <div id="dev-console-header">
            <span class="title">▶ CAPTUS GATOR DEV CONSOLE</span>
            <span class="hint">digite "help" para ver os comandos • ESC fecha</span>
        </div>
        <div id="dev-console-output"></div>
        <div id="dev-console-input-row">
            <span id="dev-console-prompt">▶</span>
            <input id="dev-console-input" type="text" autocomplete="off" spellcheck="false" placeholder="comando...">
        </div>
    </div>

<script>
// ==========================================
// SISTEMA DE ÁUDIO — Web Audio API
// ==========================================
const Sound = (() => {
    let ctx = null;
    let muted = false;
    let masterGain = null;
    let musicGain = null;
    let sfxGain = null;

    function ensureCtx() {
        if (ctx) return ctx;
        try {
            ctx = new (window.AudioContext || window.webkitAudioContext)();
            masterGain = ctx.createGain();
            masterGain.gain.value = 0.5;
            masterGain.connect(ctx.destination);

            sfxGain = ctx.createGain();
            sfxGain.gain.value = 0.7;
            sfxGain.connect(masterGain);

            musicGain = ctx.createGain();
            musicGain.gain.value = 0.35;
            musicGain.connect(masterGain);
        } catch (err) {
            console.warn('Web Audio não suportado:', err);
        }
        return ctx;
    }

    // Resume o contexto no primeiro clique/tecla (política dos navegadores).
    function resume() {
        const c = ensureCtx();
        if (c && c.state === 'suspended') c.resume();
    }

    window.addEventListener('pointerdown', resume, { once: false });
    window.addEventListener('keydown', resume, { once: false });

    function setMuted(v) {
        muted = v;
        if (masterGain) masterGain.gain.value = v ? 0 : 0.5;
        const badge = document.getElementById('audio-badge');
        if (badge) {
            badge.classList.toggle('muted', v);
            badge.textContent = v ? '🔇 [M] SOM OFF' : '🔊 [M] SOM ON';
        }
    }
    function toggleMute() { setMuted(!muted); }
    function isMuted() { return muted; }

    // Toca uma nota com envelope ADSR simples.
    function tone(freq, duration, type = 'square', vol = 0.3, target = null, detune = 0) {
        const c = ensureCtx();
        if (!c || muted) return;
        const osc = c.createOscillator();
        const gain = c.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        if (detune) osc.detune.value = detune;

        const now = c.currentTime;
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(vol, now + 0.005);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

        osc.connect(gain);
        gain.connect(target || sfxGain);
        osc.start(now);
        osc.stop(now + duration + 0.02);
    }

    // Sweep de frequência (bom pra dash, pulo, magia).
    function sweep(freqStart, freqEnd, duration, type = 'sawtooth', vol = 0.3) {
        const c = ensureCtx();
        if (!c || muted) return;
        const osc = c.createOscillator();
        const gain = c.createGain();
        osc.type = type;
        const now = c.currentTime;
        osc.frequency.setValueAtTime(freqStart, now);
        osc.frequency.exponentialRampToValueAtTime(Math.max(20, freqEnd), now + duration);

        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(vol, now + 0.005);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

        osc.connect(gain);
        gain.connect(sfxGain);
        osc.start(now);
        osc.stop(now + duration + 0.02);
    }

    // Ruído branco — bom pra explosões e hits.
    function noise(duration, vol = 0.3, filterFreq = 1200, type = 'lowpass') {
        const c = ensureCtx();
        if (!c || muted) return;
        const bufferSize = Math.floor(c.sampleRate * duration);
        const buffer = c.createBuffer(1, bufferSize, c.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

        const src = c.createBufferSource();
        src.buffer = buffer;
        const filter = c.createBiquadFilter();
        filter.type = type;
        filter.frequency.value = filterFreq;
        const gain = c.createGain();
        const now = c.currentTime;
        gain.gain.setValueAtTime(vol, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

        src.connect(filter);
        filter.connect(gain);
        gain.connect(sfxGain);
        src.start(now);
        src.stop(now + duration + 0.02);
    }

    // ==========================================
    // EFEITOS ESPECÍFICOS
    // ==========================================
    return {
        resume, toggleMute, isMuted, setMuted,

        shoot() {
            // Pew curto e agudo — arpejo de 2 notas rápidas
            tone(880, 0.06, 'square', 0.15);
            setTimeout(() => tone(1320, 0.06, 'square', 0.12), 25);
        },
        jump() {
            sweep(220, 660, 0.14, 'square', 0.22);
        },
        doubleJump() {
            sweep(330, 990, 0.16, 'triangle', 0.25);
            setTimeout(() => tone(1320, 0.08, 'square', 0.15), 60);
        },
        dash() {
            sweep(1200, 200, 0.24, 'sawtooth', 0.28);
            noise(0.22, 0.12, 2500, 'highpass');
        },
        parry() {
            // TING cristalino — dois tons harmônicos
            tone(1760, 0.35, 'triangle', 0.35);
            setTimeout(() => tone(2640, 0.35, 'triangle', 0.25), 30);
            setTimeout(() => tone(3520, 0.25, 'sine', 0.18), 60);
        },
        hitBoss() {
            noise(0.08, 0.25, 1800, 'bandpass');
            tone(220, 0.06, 'square', 0.18);
        },
        hitRabbit() {
            noise(0.1, 0.22, 900, 'lowpass');
            tone(180, 0.08, 'square', 0.15);
        },
        specialCast() {
            // Carregamento mágico
            sweep(200, 1500, 0.5, 'sine', 0.22);
        },
        specialExplode() {
            noise(0.5, 0.4, 800, 'lowpass');
            tone(110, 0.5, 'sawtooth', 0.35);
            setTimeout(() => tone(80, 0.6, 'sine', 0.28), 60);
            setTimeout(() => noise(0.3, 0.25, 3000, 'highpass'), 100);
        },
        bossShoot() {
            sweep(660, 220, 0.18, 'triangle', 0.18);
        },
        playerHurt() {
            sweep(400, 80, 0.4, 'sawtooth', 0.32);
            noise(0.35, 0.25, 600, 'lowpass');
        },
        bossDefeat() {
            // Fanfarra de vitória
            [523, 659, 784, 1046].forEach((f, i) => {
                setTimeout(() => tone(f, 0.28, 'square', 0.28), i * 110);
            });
            setTimeout(() => noise(0.6, 0.25, 500, 'lowpass'), 200);
        },
        playerDeath() {
            // Acorde menor descendente
            [440, 415, 349, 262].forEach((f, i) => {
                setTimeout(() => tone(f, 0.32, 'triangle', 0.3), i * 130);
            });
        },
        phaseChange() {
            [523, 659, 784].forEach((f, i) => {
                setTimeout(() => tone(f, 0.22, 'square', 0.25), i * 80);
            });
        },
        konami() {
            // Arpejo mágico ascendente
            [523, 587, 659, 698, 784, 880, 988, 1046].forEach((f, i) => {
                setTimeout(() => tone(f, 0.14, 'triangle', 0.22), i * 60);
            });
        },
        menuSelect() {
            tone(660, 0.08, 'square', 0.2);
            setTimeout(() => tone(990, 0.08, 'square', 0.16), 60);
        },
        specialReady() {
            [880, 1174, 1568].forEach((f, i) => {
                setTimeout(() => tone(f, 0.18, 'triangle', 0.22), i * 70);
            });
        },
        rageGrow() {
            sweep(180, 720, 0.55, 'sawtooth', 0.24);
            setTimeout(() => tone(900, 0.18, 'square', 0.20), 180);
            setTimeout(() => tone(1200, 0.24, 'triangle', 0.22), 290);
            setTimeout(() => noise(0.32, 0.16, 1800, 'highpass'), 250);
        }
    };
})();

// Atalho M para mutar/desmutar.
window.addEventListener('keydown', (e) => {
    if (e.key === 'm' || e.key === 'M') {
        // Não atrapalha se o console dev estiver aberto.
        const c = document.getElementById('dev-console');
        if (c && c.classList.contains('visible')) return;
        if (e.target && e.target.id === 'dev-console-input') return;
        Sound.toggleMute();
    }
});

// ==========================================
// CONSOLE SECRETO DE DESENVOLVEDOR
// ==========================================
const DevConsole = (() => {
    const panel   = document.getElementById('dev-console');
    const output  = document.getElementById('dev-console-output');
    const input   = document.getElementById('dev-console-input');
    const badge   = document.getElementById('dev-console-badge');

    let visible = false;
    const history = [];
    let historyIndex = -1;

    function print(text, cls = 'line-ok') {
        const div = document.createElement('div');
        div.className = cls;
        div.textContent = text;
        output.appendChild(div);
        output.scrollTop = output.scrollHeight;
    }

    function open() {
        if (visible) return;
        visible = true;
        panel.classList.add('visible');
        badge.classList.add('visible');
        setTimeout(() => input.focus(), 30);
        const activeScene = PhaserGame && PhaserGame.scene ? PhaserGame.scene.getScenes(true)[0] : null;
        if (activeScene && activeScene.input && activeScene.input.keyboard) {
            activeScene.input.keyboard.enabled = false;
        }
        print('╔══════════════════════════════════════════╗', 'line-sys');
        print('║  DEV CONSOLE ONLINE • Captus Gator v2.0  ║', 'line-sys');
        print('╚══════════════════════════════════════════╝', 'line-sys');
        print('Digite "help" para ver os comandos.', 'line-info');
    }

    function close() {
        if (!visible) return;
        visible = false;
        panel.classList.remove('visible');
        badge.classList.remove('visible');
        const activeScene = PhaserGame && PhaserGame.scene ? PhaserGame.scene.getScenes(true)[0] : null;
        if (activeScene && activeScene.input && activeScene.input.keyboard) {
            activeScene.input.keyboard.enabled = true;
        }
    }

    function toggle() { visible ? close() : open(); }

    function getActiveScene() {
        if (!PhaserGame || !PhaserGame.scene) return null;
        const scenes = PhaserGame.scene.getScenes(true);
        return scenes.length ? scenes[0] : null;
    }

    const commands = {
        help() {
            print('┌─ COMANDOS ─────────────────────────────────┐', 'line-info');
            print('│ help / clear / close / state               │', 'line-info');
            print('│ hp / damage <n> / kill / godboss on|off    │', 'line-info');
            print('│ immortal on|off / noclip on|off            │', 'line-info');
            print('│ special / phase1..phase4                   │', 'line-info');
            print('│ coords / killemall / rainbow               │', 'line-info');
            print('│ mute / unmute / volume <0-1>               │', 'line-info');
            print('└────────────────────────────────────────────┘', 'line-info');
        },
        clear() { output.innerHTML = ''; print('Console limpo.', 'line-info'); },
        close() { close(); },
        state() {
            const s = getActiveScene();
            if (!s) return print('Nenhuma cena ativa.', 'line-warn');
            print(`Cena ativa: ${s.scene.key}`, 'line-ok');
            if (s.bossHP !== undefined) print(`Boss HP: ${s.bossHP}/${s.bossMaxHP}`, 'line-ok');
            if (s.bossPhase !== undefined) print(`Fase atual: ${s.bossPhase}`, 'line-ok');
            if (s.specialHits !== undefined) print(`Especial: ${s.specialHits}/${s.specialRequired}${s.specialReady ? ' (PRONTO)' : ''}`, 'line-ok');
            if (s.konamiImmortal !== undefined) print(`Imortal: ${s.konamiImmortal ? 'SIM' : 'não'}`, 'line-ok');
            print(`Áudio: ${Sound.isMuted() ? 'MUDO' : 'LIGADO'}`, 'line-ok');
        },
        hp() {
            const s = getActiveScene();
            if (!s || s.bossHP === undefined) return print('Sem boss ativo.', 'line-warn');
            print(`Boss HP: ${s.bossHP}/${s.bossMaxHP}`, 'line-ok');
            print(`Coelho HP: ${s.rabbitHP !== undefined ? s.rabbitHP : '-'}/${s.rabbitMaxHP !== undefined ? s.rabbitMaxHP : '-'}`, 'line-ok');
        },
        damage(args) {
            const s = getActiveScene();
            if (!s || !s.applyBossDamage) return print('Sem boss ativo.', 'line-warn');
            const n = parseInt(args[0], 10);
            if (!Number.isFinite(n)) return print('Uso: damage <número>', 'line-error');
            s.applyBossDamage(n);
            print(`Dano: ${n}. HP: ${s.bossHP}`, 'line-ok');
        },
        kill() {
            const s = getActiveScene();
            if (!s || !s.applyBossDamage) return print('Sem boss ativo.', 'line-warn');
            s.applyBossDamage(s.bossHP);
            print('Boss derrotado.', 'line-ok');
        },
        godboss(args) {
            const s = getActiveScene();
            if (!s) return print('Sem cena ativa.', 'line-warn');
            const on = (args[0] || 'on').toLowerCase() === 'on';
            s.__godboss = on;
            print(`Godboss: ${on ? 'ATIVADO' : 'DESATIVADO'}`, 'line-ok');
        },
        immortal(args) {
            const s = getActiveScene();
            if (!s) return print('Sem cena ativa.', 'line-warn');
            const on = (args[0] || 'on').toLowerCase() === 'on';
            s.konamiImmortal = on;
            if (s.immortalHud) s.immortalHud.setVisible(on);
            print(`Imortalidade: ${on ? 'ATIVADA' : 'DESATIVADA'}`, 'line-ok');
        },
        noclip(args) {
            const s = getActiveScene();
            if (!s) return print('Sem cena ativa.', 'line-warn');
            const on = (args[0] || 'on').toLowerCase() === 'on';
            s.__noclip = on;
            if (s.player && s.player.body) {
                s.player.body.checkCollision.none = on;
                s.player.body.allowGravity = !on;
            }
            print(`Noclip: ${on ? 'ATIVADO' : 'DESATIVADO'}`, 'line-ok');
        },
        special() {
            const s = getActiveScene();
            if (!s || s.specialHits === undefined) return print('Sem cena ativa.', 'line-warn');
            s.specialHits = s.specialRequired;
            s.specialReady = true;
            if (s.updateSpecialMeter) s.updateSpecialMeter();
            Sound.specialReady();
            print('Especial carregado!', 'line-ok');
        },
        phase1() { return commands.__gotoPhase(1); },
        phase2() { return commands.__gotoPhase(2); },
        phase3() { return commands.__gotoPhase(3); },
        phase4() { return commands.__gotoPhase(4); },
        __gotoPhase(n) {
            const s = getActiveScene();
            if (!s || !s.transitionToPhase2) return print('Sem cena ativa.', 'line-warn');
            if (n === 1) {
                print('Reiniciando para Fase 1...', 'line-warn');
                return PhaserGame.scene.getScene('GameScene').scene.restart();
            }
            if (n === 2 && s.bossPhase === 1) s.transitionToPhase2();
            else if (n === 3 && s.bossPhase === 2) s.transitionToPhase3();
            else if (n === 4 && s.bossPhase === 3) s.transitionToPhase4();
            else {
                s.bossPhase = n - 1;
                if (n === 2) s.transitionToPhase2();
                else if (n === 3) s.transitionToPhase3();
                else if (n === 4) s.transitionToPhase4();
            }
            print(`Indo para fase ${n}.`, 'line-ok');
        },
        coords() {
            const s = getActiveScene();
            if (!s) return print('Sem cena ativa.', 'line-warn');
            if (s.player) print(`Player: x=${Math.round(s.player.x)} y=${Math.round(s.player.y)}`, 'line-ok');
            if (s.boss)   print(`Boss:   x=${Math.round(s.boss.x)} y=${Math.round(s.boss.y)}`, 'line-ok');
            if (s.rabbit) print(`Coelho: x=${Math.round(s.rabbit.x)} y=${Math.round(s.rabbit.y)}`, 'line-ok');
        },
        killemall() {
            const s = getActiveScene();
            if (!s) return print('Sem cena ativa.', 'line-warn');
            if (s.playerBullets) s.playerBullets.clear(true, true);
            if (s.bossOrbs) { s.bossOrbs.children.iterate(o => { if (o.particles) o.particles.destroy(); }); s.bossOrbs.clear(true, true); }
            if (s.carrots) s.carrots.clear(true, true);
            print('Projéteis removidos.', 'line-ok');
        },
        rainbow() {
            const s = getActiveScene();
            if (!s || !s.player) return print('Sem player.', 'line-warn');
            s.__rainbow = !s.__rainbow;
            if (!s.__rainbow) {
                s.player.clearTint();
                if (s.__rainbowTimer) s.__rainbowTimer.remove();
                print('Modo festa desativado.', 'line-info');
                return;
            }
            let hue = 0;
            s.__rainbowTimer = s.time.addEvent({
                delay: 80, loop: true,
                callback: () => {
                    if (!s.player || !s.player.active) return;
                    hue = (hue + 25) % 360;
                    s.player.setTint(Phaser.Display.Color.HSVToRGB(hue / 360, 1, 1).color);
                }
            });
            print('🌈 Modo festa ATIVADO.', 'line-sys');
        },
        mute()   { Sound.setMuted(true);  print('Áudio mutado.', 'line-ok'); },
        unmute() { Sound.setMuted(false); print('Áudio ativado.', 'line-ok'); },
        volume(args) {
            const v = parseFloat(args[0]);
            if (!Number.isFinite(v) || v < 0 || v > 1) return print('Uso: volume <0..1>', 'line-error');
            Sound.setMuted(false);
            if (window.__masterGainRef) window.__masterGainRef.gain.value = v;
            print(`Volume master = ${v}`, 'line-ok');
        }
    };

    function execute(raw) {
        const text = raw.trim();
        if (!text) return;
        history.push(text);
        historyIndex = history.length;
        print(`> ${text}`, 'line-echo');

        const parts = text.split(/\s+/);
        const cmd = parts[0].toLowerCase();
        const args = parts.slice(1);

        if (commands[cmd]) {
            try { commands[cmd](args); }
            catch (err) { print('Erro: ' + err.message, 'line-error'); }
        } else {
            print(`Comando desconhecido: "${cmd}". Digite "help".`, 'line-error');
        }
    }

    window.addEventListener('keydown', (e) => {
        if (e.key === 'F12' || e.code === 'F12') {
            e.preventDefault(); toggle(); return;
        }
        if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j')) {
            e.preventDefault(); toggle(); return;
        }
        if (e.key === 'Escape' && visible) {
            e.preventDefault(); close(); return;
        }
    }, true);

    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            execute(input.value);
            input.value = '';
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            if (history.length === 0) return;
            historyIndex = Math.max(0, historyIndex - 1);
            input.value = history[historyIndex] || '';
        } else if (e.key === 'ArrowDown') {
            e.preventDefault();
            if (history.length === 0) return;
            historyIndex = Math.min(history.length, historyIndex + 1);
            input.value = history[historyIndex] || '';
        }
    });

    return { open, close, toggle, print, isOpen: () => visible };
})();

// ==========================================
// CONFIGURAÇÃO DE CONTROLES
// ==========================================
const CONTROL_DEFAULTS = {
    left:    { code: 65, label: 'A' },
    right:   { code: 68, label: 'D' },
    jump:    { code: 87, label: 'W' },
    down:    { code: 83, label: 'S' },
    dash:    { code: 16, label: 'SHIFT' },
    parry:   { code: 32, label: 'ESPAÇO' },
    shoot:   { code: 88, label: 'X' },
    special: { code: 86, label: 'V' }
};

const CONTROL_LABELS = {
    left: 'MOVER PARA ESQUERDA',
    right: 'MOVER PARA DIREITA',
    jump: 'PULAR',
    down: 'DESCER DA PLATAFORMA',
    dash: 'DASH',
    parry: 'PARRY',
    shoot: 'ATIRAR',
    special: 'ESPECIAL'
};

function cloneControlDefaults() {
    const copy = {};
    Object.keys(CONTROL_DEFAULTS).forEach((key) => { copy[key] = { ...CONTROL_DEFAULTS[key] }; });
    return copy;
}

function getControlConfig() {
    let config = cloneControlDefaults();
    try {
        const saved = JSON.parse(localStorage.getItem('captusGatorControls') || 'null');
        if (saved && typeof saved === 'object') {
            Object.keys(config).forEach((key) => {
                if (saved[key] && Number.isFinite(saved[key].code)) {
                    config[key] = {
                        code: Number(saved[key].code),
                        label: typeof saved[key].label === 'string' ? saved[key].label : CONTROL_DEFAULTS[key].label
                    };
                }
            });
        }
    } catch (err) {}
    return config;
}

function saveControlConfig(config) {
    try { localStorage.setItem('captusGatorControls', JSON.stringify(config)); } catch (err) {}
}

function keyboardEventToBinding(event) {
    const code = Number(event.which || event.keyCode || 0);
    if (!code) return null;
    let label = (event.key || event.code || '').toString();
    const codeName = (event.code || '').toUpperCase();
    const friendly = {
        SPACE: 'ESPAÇO', ARROWLEFT: '←', ARROWRIGHT: '→', ARROWUP: '↑', ARROWDOWN: '↓',
        SHIFTLEFT: 'SHIFT', SHIFTRIGHT: 'SHIFT', CONTROLLEFT: 'CTRL', CONTROLRIGHT: 'CTRL',
        ALTLEFT: 'ALT', ALTRIGHT: 'ALT', ENTER: 'ENTER', TAB: 'TAB', BACKSPACE: 'BACKSPACE',
        CAPSLOCK: 'CAPS LOCK', ESCAPE: 'ESC'
    };
    if (friendly[codeName]) label = friendly[codeName];
    else if (/^KEY[A-Z]$/.test(codeName)) label = codeName.slice(3);
    else if (/^DIGIT[0-9]$/.test(codeName)) label = codeName.slice(5);
    else if (/^NUMPAD[0-9]$/.test(codeName)) label = 'NUM ' + codeName.slice(5);
    else if (label.length === 1) label = label.toUpperCase();
    else label = codeName || label.toUpperCase();
    return { code, label };
}

function controlLabelForMenu(config, key) {
    return config[key]?.label || CONTROL_DEFAULTS[key].label;
}

        }).setOrigin(0.5);

    openSettings() { this.settingsOpen = true; this.pendingControl = null; this.menuControlConfig = getControlConfig(); this.refreshSettingsRows(); this.settingsStatus.setText('Escolha uma ação para alterar.'); this.settingsLayer.setVisible(true); }
    closeSettings() { this.settingsOpen = false; this.pendingControl = null; this.menuControlConfig = getControlConfig(); this.updateMenuControlTexts(); this.settingsLayer.setVisible(false); }
    startControlCapture(control) {
        if (!this.settingsOpen) return;
        this.pendingControl = control;
        this.settingsStatus.setText(`Pressione uma tecla para: ${CONTROL_LABELS[control]}  •  ESC cancela`);
        this.settingsRows[control].buttonText.setText('PRESSIONE...');
    }
    captureControlKey(event) {
        if (!this.pendingControl) return;
        if (event.code === 'Escape' || event.keyCode === 27) {
            this.settingsStatus.setText('Alteração cancelada.');
            this.settingsRows[this.pendingControl].buttonText.setText('ALTERAR');
            this.pendingControl = null;
            return;
        }
        const binding = keyboardEventToBinding(event);
        if (!binding) return;
        const duplicate = Object.keys(this.menuControlConfig).find((key) =>
            key !== this.pendingControl && this.menuControlConfig[key].code === binding.code
        );
        if (duplicate) { this.settingsStatus.setText(`Essa tecla já está em: ${CONTROL_LABELS[duplicate]}.`); return; }
        this.menuControlConfig[this.pendingControl] = binding;
        saveControlConfig(this.menuControlConfig);
        const changed = this.pendingControl;
        this.pendingControl = null;
        this.settingsRows[changed].buttonText.setText('ALTERAR');
        this.settingsStatus.setText(`${CONTROL_LABELS[changed]} = ${binding.label}`);
        this.refreshSettingsRows();
        this.updateMenuControlTexts();
        event.preventDefault();
    }
    refreshSettingsRows() {
        if (!this.settingsRows) return;
        const config = this.menuControlConfig || getControlConfig();
        Object.keys(this.settingsRows).forEach((key) => {
            this.settingsRows[key].keyText.setText(`[ ${controlLabelForMenu(config, key)} ]`);
            if (this.pendingControl !== key) this.settingsRows[key].buttonText.setText('ALTERAR');
        });
    }
    resetControls() {
        this.menuControlConfig = cloneControlDefaults();
        saveControlConfig(this.menuControlConfig);
        this.pendingControl = null;
        this.refreshSettingsRows();
        this.updateMenuControlTexts();
        this.settingsStatus.setText('Controles restaurados para o padrão.');
    }
}

        }).setOrigin(0.5).setDepth(101);

        this.lines = [
            { speaker: 'GATOR', color: '#00e676', text: 'Droga, eu preciso conseguir sair da aqui!' },
            { speaker: 'FUINHA', color: '#ff4081', text: 'Aonde o senhor pensa que vai?' },
            { speaker: 'GATOR', color: '#00e676', text: 'Vou fugir da Aqui, tá surdo?' },
            { speaker: 'FUINHA', color: '#ff4081', text: 'Seus truques baratos não vão funcionar comigo, VOCÊ SELOU O CONTRATADO ESTA PRESO AQUI!' },
            { speaker: 'GATOR', color: '#00e676', text: 'AH, DROGA EU SÓ TENHO', red: 'UMA CHANCE', afterRed: ' DE DERROTAR ELE' }
        ];

        this.showLine(0);

        this.input.keyboard.on('keydown', (event) => {
            if (event.code === 'Escape') {
                event.preventDefault();
                this.finishCutscene();
                return;
            }
            if (event.code === 'Enter' || event.code === 'Space') {
                event.preventDefault();
                this.nextLine();
            }
        });
    }

    createCutsceneGator(x, y) {
        // Usa diretamente o MESMO sprite do gameplay, incluindo a cartola integrada.
        const c = this.add.container(x, y);
        const shadow = this.add.ellipse(0, 74, 108, 18, 0x000000, 0.45).setDepth(0);
        const sprite = this.add.image(0, 0, 'gator_idle').setScale(3.15).setDepth(2);
        const glow = this.add.circle(38, -52, 16, 0x00e5ff, 0.08).setDepth(1);
        c.add([shadow, glow, sprite]);
        c.sprite = sprite;
        this.tweens.add({ targets: glow, scale: 1.25, alpha: 0.16, duration: 420, yoyo: true, repeat: -1 });
        return c;
    }

    createCutsceneWeasel(x, y) {
        // Usa diretamente o MESMO sprite do boss no gameplay, incluindo roupa, patas e cauda.
        const c = this.add.container(x, y);
        const shadow = this.add.ellipse(0, 112, 118, 20, 0x000000, 0.45).setDepth(0);
        const sprite = this.add.image(0, 0, 'boss').setScale(3.1).setDepth(2);
        const glow = this.add.circle(-88, -12, 22, 0x00e5ff, 0.08).setDepth(1);
        c.add([shadow, glow, sprite]);
        c.sprite = sprite;
        this.tweens.add({ targets: glow, scale: 1.3, alpha: 0.16, duration: 500, yoyo: true, repeat: -1 });
        return c;
    }

    showLine(index) {
        if (this.ending) return;
        this.currentLine = index;
        const line = this.lines[index];
        this.speakerText.setText(line.speaker + ' —').setFill(line.color);
        this.dialogText.setText(line.text);
        this.redChanceText.setText('');

        if (line.red) {
            this.dialogText.setText(line.text);
            this.redChanceText.setText(line.red);
            const redWidth = this.redChanceText.width;
            this.redChanceText.x = 75 + this.dialogText.width + 6;
            this.redChanceText.y = 442;
            const after = line.afterRed || '';
            this.afterRedText?.destroy();
            this.afterRedText = this.add.text(this.redChanceText.x + redWidth + 8, 442, after, {
                fontFamily: '"Press Start 2P"', fontSize: '12px', fill: '#ffffff',
                stroke: '#000000', strokeThickness: 2
            }).setDepth(101);
        } else {
            this.afterRedText?.destroy();
            this.afterRedText = null;
        }

        // Pequeno feedback de entrada de fala.
        this.speakerText.setScale(0.92).setAlpha(0);
        this.dialogText.setScale(0.96).setAlpha(0);
        this.tweens.add({ targets: [this.speakerText, this.dialogText], alpha: 1, scaleX: 1, scaleY: 1, duration: 180, ease: 'Back.Out' });
        Sound.menuSelect();
    }

    nextLine() {
        if (this.ending) return;
        if (this.currentLine >= this.lines.length - 1) {
            this.finishCutscene();
        } else {
            this.showLine(this.currentLine + 1);
        }
    }

    finishCutscene() {
        if (this.ending) return;
        this.ending = true;
        Sound.menuSelect();
        this.tweens.add({
            targets: [this.dialogPanel, this.speakerText, this.dialogText, this.redChanceText, this.afterRedText, this.dialogHint, this.gatorCut, this.weaselCut],
            alpha: 0,
            duration: 350,
            ease: 'Sine.easeIn',
            onComplete: () => {
                try { sessionStorage.setItem('captusIntroSeen', '1'); } catch (err) {}
                this.scene.start('GameScene', { konamiImmortal: this.konamiImmortal, fromIntro: true });
            }
        });
    }
}

    createPauseMenu() {
