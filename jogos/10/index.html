                    ÁUDIO
========================================================

Criamos sons simples usando Web Audio.

let audioContext = null;

function iniciarAudio() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    if (
        audioContext.state === "suspended"
    ) {

        audioContext.resume();

    }

}


function tocarSom(
    frequencia,
    duracao = 0.12,
    tipo = "square",
    volume = 0.08
) {

    iniciarAudio();

    const oscilador =
        audioContext.createOscillator();

    const ganho =
        audioContext.createGain();


    oscilador.type = tipo;

    oscilador.frequency.setValueAtTime(
        frequencia,
        audioContext.currentTime
    );


    ganho.gain.setValueAtTime(
        volume,
        audioContext.currentTime
    );


    ganho.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + duracao
    );


    oscilador.connect(ganho);

    ganho.connect(
        audioContext.destination
    );


    oscilador.start();

    oscilador.stop(
        audioContext.currentTime + duracao
    );

}

function iniciarMusicaBatalha(scene) {
    if (!musicaBatalha) {
        musicaBatalha = scene.sound.add("musica_batalha", { loop: true, volume: 0.35 });
    }
    if (!musicaBatalha.isPlaying) musicaBatalha.play();
}

function pararMusicaBatalha() {
    if (musicaBatalha && musicaBatalha.isPlaying) musicaBatalha.stop();
}

function iniciarMusicaSuspense(scene) {
    if (!musicaSuspense) {
        musicaSuspense = scene.sound.add("musica_suspense", { loop: true, volume: 0.32 });
    }
    if (!musicaSuspense.isPlaying) musicaSuspense.play();
}

function pararMusicaSuspense() {
    if (musicaSuspense && musicaSuspense.isPlaying) musicaSuspense.stop();
}

function iniciarMusicaVitoria(scene) {
    if (!musicaVitoria) {
        musicaVitoria = scene.sound.add("musica_vitoria", { loop: false, volume: 0.65 });
    }
    musicaVitoria.stop();
    musicaVitoria.play();
}

function pararMusicaVitoria() {
    if (musicaVitoria && musicaVitoria.isPlaying) musicaVitoria.stop();
}

function iniciarMusicaGameOver(scene) {
    if (!musicaGameOver) {
        musicaGameOver = scene.sound.add("musica_game_over", { loop: false, volume: 0.55 });
    }
    musicaGameOver.stop();
    musicaGameOver.play();
}

/*

========================================================
*/

const textoPrologo =

"Em um mundo sucumbido pela fúria de uma rainha que surgiu misteriosamente, uma força de combatentes poderosos são invocados para deter o mal.\n\n" +

"Infelizmente todo o esquadrão foi brutalmente assassinado... Com exceção de um único homem: Raiden.\n\n" +

"Ele vaga em busca de treinar mais para conseguir derrotar a Rainha que um dia tirou tudo dele...\n\n" +

"9 meses se passam. A Rainha implantou várias de suas sementes orgânicas em todo o mundo, querendo que ele exploda.\n\n" +

"Mas o nosso herói enfim aparece para derrotá-la.\n\n" +

"Mas ele tem apenas 1 minuto antes que tudo acabe.\n\n" +

"E chegou o dia...\n\n";

const textoBatalhaFinal = "DA BATALHA FINAL!";


PrologoScene.prototype.create =
function () {

    const scene = this;

    iniciarAudio();
    iniciarMusicaSuspense(scene);

    scene.add.rectangle(W / 2, H / 2, W, H, 0x050609);

    scene.add.circle(1000, 150, 250, 0x460912, 0.16);

    scene.add.text(W / 2, 75, "PRÓLOGO", {
        fontFamily: "monospace",
        fontSize: "28px",
        fontStyle: "bold",
        color: "#b51f2e",
        stroke: "#000000",
        strokeThickness: 5
    }).setOrigin(0.5);

    scene.add.rectangle(
        W / 2, 370, 1120, 520,
        0x0d1015, 0.94
    ).setStrokeStyle(2, 0x6c2029, 0.75);

    /* Texto principal do prólogo */
    const texto = scene.add.text(
        95, 135, "", {
            fontFamily: "Garamond, Georgia, serif",
            fontSize: "20px",
            color: "#eeeeee",
            lineSpacing: 6,
            wordWrap: { width: 1090 }
        }
    );

    /* A frase final fica separada para ficar vermelha. */
    const textoFinal = scene.add.text(
        95, 135, "", {
            fontFamily: "Garamond, Georgia, serif",
            fontSize: "20px",
            fontStyle: "bold",
            color: "#d3263d",
            lineSpacing: 6,
            wordWrap: { width: 1090 }
        }
    );

    textoFinal.setVisible(false);

    let indice = 0;
    let terminou = false;
    let pulou = false;

    const continuar = scene.add.rectangle(
        W / 2, 665, 240, 48, 0x7a1d29
    )
    .setStrokeStyle(2, 0xc94b5a)
    .setInteractive({ useHandCursor: true })
    .setAlpha(0);

    const textoContinuar = scene.add.text(
        W / 2, 665, "CONTINUAR", {
            fontFamily: "monospace",
            fontSize: "20px",
            fontStyle: "bold",
            color: "#ffffff"
        }
    ).setOrigin(0.5).setAlpha(0);

    /* Botão para pular o texto imediatamente. */
    const pular = scene.add.rectangle(
        W - 145, 665, 190, 48, 0x3b1118
    )
    .setStrokeStyle(2, 0xd3263d)
    .setInteractive({ useHandCursor: true });

    const textoPular = scene.add.text(
        W - 145, 665, "PULAR >>", {
            fontFamily: "monospace",
            fontSize: "18px",
            fontStyle: "bold",
            color: "#ff6675"
        }
    ).setOrigin(0.5);

    function liberarContinuar(){
        if(terminou) return;
        terminou = true;
        continuar.setAlpha(1);
        textoContinuar.setAlpha(1);
        pular.setAlpha(0);
        textoPular.setAlpha(0);
        somMenu();
    }

    function mostrarBatalhaFinal(){
        textoFinal.setText(textoBatalhaFinal);
        textoFinal.setPosition(95, texto.y + texto.height + 4);
        textoFinal.setVisible(true);
        liberarContinuar();
    }

    const eventoTexto = scene.time.addEvent({
        delay: 18,
        repeat: textoPrologo.length - 1,
        callback: () => {
            if(pulou) return;
            texto.text += textoPrologo[indice];
            indice++;
        }
    });

    /* Depois do texto principal, mostra a frase vermelha. */
    scene.time.delayedCall(
        textoPrologo.length * 18 + 100,
        () => {
            if(!pulou) mostrarBatalhaFinal();
        }
    );

    function pularPrologo(){
        if(terminou) return;
        pulou = true;
        eventoTexto.remove(false);
        texto.setText(textoPrologo);
        mostrarBatalhaFinal();
    }

    pular.on("pointerover", () => {
        pular.setFillStyle(0x601923);
        textoPular.setColor("#ffffff");
    });

    pular.on("pointerout", () => {
        pular.setFillStyle(0x3b1118);
        textoPular.setColor("#ff6675");
    });

    pular.on("pointerdown", pularPrologo);

    continuar.on("pointerover", () => {
        continuar.setFillStyle(0xa62b3a);
    });

    continuar.on("pointerout", () => {
        continuar.setFillStyle(0x7a1d29);
    });

    continuar.on("pointerdown", () => {
        iniciarAudio();
        somMenu();
        pararMusicaSuspense();
        scene.cameras.main.fadeOut(350, 0, 0, 0);
        scene.time.delayedCall(350, () => {
            scene.scene.start("BattleScene");
        });
    });

    scene.input.keyboard.on("keydown-SPACE", pularPrologo);

    scene.input.keyboard.on("keydown-F", () => {
        if(scene.scale.isFullscreen){
            scene.scale.stopFullscreen();
        }else{
            scene.scale.startFullscreen();
        }
    });

};

function criarControlesBattle(scene) {


    scene.teclas =

        scene.input.keyboard.addKeys({

            ataque:
                Phaser.Input.Keyboard.KeyCodes.Z,

            defesa:
                Phaser.Input.Keyboard.KeyCodes.X,

            esquerda:
                Phaser.Input.Keyboard.KeyCodes.LEFT,

            reiniciar:
                Phaser.Input.Keyboard.KeyCodes.R,

            fullscreen:
                Phaser.Input.Keyboard.KeyCodes.F

        });


    scene.input.keyboard.on(

        "keydown-F",

        () => {

            if (
                scene.scale.isFullscreen
            ) {

                scene.scale.stopFullscreen();

            }

            else {

                scene.scale.startFullscreen();

            }

        }

    );


    scene.time.addEvent({

        delay: 1000,

        callback: () => {

            diminuirTempoBattle(scene);

        },

        loop: true

    });

}

/*
========================================================
                    UPDATE
========================================================
*/

BattleScene.prototype.update =
function () {

    const scene = this;


    if (
        scene.jogoAcabou
    ) {


        if (

            Phaser.Input.Keyboard.JustDown(

                scene.teclas.reiniciar

            )

        ) {

            scene.scene.restart();

        }


        return;

    }


    if (

        scene.turnoJogador &&

        !scene.actionLocked

    ) {


        if (

            Phaser.Input.Keyboard.JustDown(

                scene.teclas.ataque

            )

        ) {

            atacarBattle(scene);

        }



        if (

            Phaser.Input.Keyboard.JustDown(

                scene.teclas.defesa

            )

        ) {

            defenderBattle(scene);

        }

    }

};


/*
========================================================
                    TIMER
========================================================
*/

function diminuirTempoBattle(scene) {


    if (
        scene.jogoAcabou
    )

        return;


    scene.tempoRestante--;


    scene.textoTempo.setText(

        scene.tempoRestante

    );


    if (

        scene.tempoRestante <= 10

    ) {

        scene.textoTempo.setColor(
            "#ff4757"
        );


        if (
            scene.tempoRestante > 0
        ) {

            somTempo();

        }

    }


    if (

        scene.tempoRestante <= 0

    ) {

        scene.tempoRestante = 0;

        finalizarBattle(
            scene,
            "tempo"
        );

    }

}


/*
========================================================
                        ATAQUE
========================================================
*/

function atacarBattle(scene) {

    if (scene.actionLocked || !scene.turnoJogador) return;

    scene.actionLocked = true;
    scene.turnoJogador = false;
    scene.ataquesDoJogador++;

    tocarEfeitoAtaqueArquivo();

    scene.textoTurno.setText("ATAQUE!");
    scene.textoMensagem.setText("Raiden atacando...");

    const baseScaleX = scene.jogador.scaleX;
    const baseScaleY = scene.jogador.scaleY;

    scene.jogador.play("raiden_run");

    scene.tweens.add({
        targets: scene.jogador,
        x: 455,
        duration: 220,
        ease: "Quad.easeOut",
        onComplete: () => {
            if (scene.jogoAcabou) return;

            scene.jogador.anims.stop();
            const animacaoAtaque = (scene.ataquesDoJogador % 2 === 0)
                ? "raiden_attack2"
                : "raiden_attack1";

            scene.jogador.play(animacaoAtaque);
            scene.jogador.setScale(baseScaleX, baseScaleY);

            efeitoGolpeBattle(scene, 540, GROUND_Y - 105, 1);

            scene.time.delayedCall(300, () => {
                resolverAtaqueBattle(scene);
            });
        }
    });
}


/*
========================================================
                RESOLVER ATAQUE
========================================================
*/

function resolverAtaqueBattle(scene) {


    if (
        scene.jogoAcabou
    )

        return;


    let chanceDesvio;


    /*
        PRIMEIRO ATAQUE = 70%
    */

    if (
        scene.ataquesDoJogador === 1
    ) {

        chanceDesvio = 70;

    }

    else if (
        scene.ataquesDoJogador === 2
    ) {

        chanceDesvio = 60;

    }

    else {

        chanceDesvio = 30;

    }


    const sorteio =
        Phaser.Math.Between(
            1,
            100
        );


    if (
        sorteio <= chanceDesvio
    ) {


        somEsquiva();


        scene.textoMensagem.setText(
            "A Rainha Kitsune desviou!"
        );


        scene.chefe.play(
            "kitsune_run"
        );


        efeitoDash(
            scene,
            scene.chefe.x,
            scene.chefe.y - 110,
            -1
        );


        scene.tweens.add({

            targets:
                scene.chefe,

            x:
                1025,

            duration:
                160,

            yoyo:
                true,

            onComplete: () => {

                scene.chefe.x = 950;

                scene.chefe.play(
                    "kitsune_idle"
                );

                turnoBossBattle(scene);

            }

        });

    }

    else {


        somAcerto();


        scene.coracaoChefe.setText("");


        scene.textoMensagem.setText(
            "Golpe certeiro!"
        );


        scene.chefe.play(
            "kitsune_hurt"
        );


        efeitoAcertoBattle(
            scene,
            scene.chefe.x,
            scene.chefe.y - 115
        );


        scene.time.delayedCall(

            260,

            () => {

                scene.chefe.play(
                    "kitsune_dead"
                );


                scene.time.delayedCall(

                    850,

                    () => {

                        finalizarBattle(
                            scene,
                            "vitoria"
                        );

                    }

                );

            }

        );

    }

}


/*
========================================================
                        DEFESA
========================================================
*/

function defenderBattle(scene) {

    if (scene.actionLocked || !scene.turnoJogador) return;

    scene.actionLocked = true;
    scene.turnoJogador = false;
    scene.defendendo = true;

    somBloqueio();

    scene.textoTurno.setText("DEFESA!");
    scene.textoMensagem.setText("Raiden se encolheu para se defender...");

    const baseScaleX = scene.jogador.scaleX;
    const baseScaleY = scene.jogador.scaleY;

    scene.jogador.play("raiden_defesa");

    scene.tweens.add({
        targets: scene.jogador,
        scaleX: baseScaleX * 0.78,
        scaleY: baseScaleY * 0.78,
        duration: 160,
        ease: "Quad.easeOut",
        onComplete: () => {
            scene.time.delayedCall(350, () => {
                turnoBossBattle(scene);
            });
        }
    });
}


/*
========================================================

========================================================
*/

function turnoBossBattle(scene) {

    scene.textoTurno.setText("VEZ DA RAINHA KITSUNE");
    scene.textoMensagem.setText("A Rainha Kitsune está atacando...");

    scene.time.delayedCall(550, () => {

        if (scene.jogoAcabou) return;

        tocarEfeitoAtaqueArquivo();

        const ataqueKitsune = Phaser.Math.Between(1, 3);
        scene.chefe.play(`kitsune_attack${ataqueKitsune}`);

        scene.tweens.add({
            targets: scene.chefe,
            x: 900,
            duration: 180,
            ease: "Quad.easeOut",
            yoyo: true
        });

        scene.time.delayedCall(320, () => {
            resolverAtaqueBossBattle(scene);
        });
    });
}


/*
========================================================
                ATAQUE DA RAINHA
========================================================
*/

function resolverAtaqueBossBattle(scene) {


    if (
        scene.jogoAcabou
    )

        return;


    /* restaura a escala normal depois da defesa */
    scene.jogador.setScale(150 / 96, 150 / 96);


    /*
    ====================================================
                        BLOQUEIO
    ====================================================
    */

    if (
        scene.defendendo
    ) {


        scene.defendendo = false;


        somBloqueio();


        scene.textoMensagem.setText(
            "Raiden bloqueou o ataque!"
        );


        efeitoBloqueioBattle(
            scene,
            scene.jogador.x,
            scene.jogador.y - 80
        );


        scene.time.delayedCall(

            500,

            () => {

                voltarTurnoJogador(
                    scene
                );

            }

        );


        return;

    }


    /*
    ====================================================
                        ESQUIVA
    ====================================================
    */

    const chanceDesvio =

        scene.ataquesDoJogador <= 1

            ? 70

            : 55;


    const sorteio =
        Phaser.Math.Between(
            1,
            100
        );


    if (
        sorteio <= chanceDesvio
    ) {


        somEsquiva();


        scene.textoMensagem.setText(
            "Raiden desviou!"
        );


        scene.jogador.play(
            "raiden_run"
        );


        efeitoDash(
            scene,
            scene.jogador.x,
            scene.jogador.y - 80,
            1
        );


        scene.tweens.add({

            targets:
                scene.jogador,

            x:
                260,

            duration:
                180,

            yoyo:
                true,

            onComplete: () => {

                scene.jogador.x = 330;

                scene.jogador.play(
                    "raiden_idle"
                );


                scene.time.delayedCall(

                    450,

                    () => {

                        voltarTurnoJogador(
                            scene
                        );

                    }

                );

            }

        });

    }

    else {


        somAcerto();


        scene.coracaoJogador.setText("");


        scene.textoMensagem.setText(
            "A Rainha Kitsune acertou Raiden!"
        );


        scene.jogador.play(
            "raiden_hurt"
        );


        efeitoAcertoBattle(
            scene,
            scene.jogador.x,
            scene.jogador.y - 70
        );


        scene.time.delayedCall(

            280,

            () => {

                scene.jogador.play(
                    "raiden_dead"
                );


                scene.time.delayedCall(

                    700,

                    () => {

                        finalizarBattle(
                            scene,
                            "derrota"
                        );

                    }

                );

            }

        );

    }

}


/*
========================================================
            VOLTAR PARA O RAIDEN
========================================================
*/

function voltarTurnoJogador(scene) {


    if (
        scene.jogoAcabou
    )

        return;


    scene.jogador.x = 330;

    scene.jogador.setScale(150 / 96, 150 / 96);

    scene.chefe.x = 950;


    scene.jogador.play(
        "raiden_idle"
    );


    scene.chefe.play(
        "kitsune_idle"
    );


    scene.chefe.setFlipX(true);


    scene.turnoJogador = true;

    scene.actionLocked = false;


    scene.textoTurno.setText(
        "SUA VEZ!"
    );


    scene.textoMensagem.setText(
        "Ataque ou defenda-se."
    );

}


/*
========================================================
                FINAL DA BATALHA
========================================================
*/

function finalizarBattle(
    scene,
    resultado
) {


    if (
        scene.jogoAcabou
    )

        return;


    scene.jogoAcabou = true;

    scene.actionLocked = true;
    pararMusicaBatalha();


    /*
        R aparece somente agora.
    */

    scene.textoControles.setText(
        "[ R ]  REINICIAR"
    );


    if (
        resultado === "vitoria"
    ) {


        scene.scene.start(

            "FinalScene",

            {

                resultado:
                    "vitoria"

            }

        );

    }


    else if (
        resultado === "derrota"
    ) {


        scene.scene.start(

            "FinalScene",

            {

                resultado:
                    "derrota"

            }

        );

    }


    else {


        scene.scene.start(

            "FinalScene",

            {

                resultado:
                    "tempo"

            }

        );

    }

}

========================================================
*/

function efeitoGolpeBattle(
    scene,
    x,
    y,
    direcao
) {


    for (
        let i = 0;
        i < 4;
        i++
    ) {


        const linha =

            scene.add.line(

                x + i * 12 * direcao,

                y + i * 6,

                0,
                0,

                65,
                0,

                0xffffff,

                0.9 - i * 0.15

            )

            .setDepth(25);


        linha.setAngle(

            -18 +
            Math.random() * 36

        );


        scene.tweens.add({

            targets:
                linha,

            alpha:
                0,

            scaleX:
                1.7,

            duration:
                180 + i * 25,

            onComplete: () => {

                linha.destroy();

            }

        });

    }

}


function efeitoDash(
    scene,
    x,
    y,
    direcao
) {


    for (
        let i = 0;
        i < 6;
        i++
    ) {


        const rastro =

            scene.add.rectangle(

                x -
                direcao * i * 18,

                y +
                i * 5,

                60 -
                i * 6,

                4,

                0xffffff,

                0.75 -
                i * 0.09

            )

            .setDepth(25);


        rastro.setAngle(

            direcao > 0
                ? 8
                : -8

        );


        scene.tweens.add({

            targets:
                rastro,

            alpha:
                0,

            x:
                rastro.x -
                direcao * 55,

            duration:
                200,

            onComplete: () => {

                rastro.destroy();

            }

        });

    }

}


function efeitoAcertoBattle(
    scene,
    x,
    y
) {


    const circulo =

        scene.add.circle(

            x,
            y,

            45,

            0xffffff,

            0.75

        )

        .setDepth(30);


    scene.tweens.add({

        targets:
            circulo,

        alpha:
            0,

        scale:
            2.2,

        duration:
            220,

        onComplete: () => {

            circulo.destroy();

        }

    });

}


function efeitoBloqueioBattle(
    scene,
    x,
    y
) {


    const escudo =

        scene.add.circle(

            x,
            y,

            40,

            0x8ee7ff,

            0.22

        )

        .setStrokeStyle(

            6,

            0xdff8ff,

            0.95

        )

        .setDepth(30);


    scene.tweens.add({

        targets:
            escudo,

        scale:
            1.5,

        alpha:
            0,

        duration:
            300,

        onComplete: () => {

            escudo.destroy();

        }

    });

}


/*
========================================================
                    DESFECHO
========================================================
*/

function FinalScene() {

    Phaser.Scene.call(

        this,

        {

            key:
                "FinalScene"

        }

    );

}


FinalScene.prototype =
    Object.create(
        Phaser.Scene.prototype
    );


FinalScene.prototype.constructor =
    FinalScene;


/*
========================================================
                    CREATE FINAL
========================================================
*/

FinalScene.prototype.create =
function (data) {

    const scene = this;

    pararMusicaSuspense();
    pararMusicaBatalha();
    pararMusicaVitoria();
    if (musicaGameOver && musicaGameOver.isPlaying) musicaGameOver.stop();


    let titulo = "";

    let mensagem = "";

    let cor = "#ffffff";


    /*
    ====================================================
                        VITÓRIA
    ====================================================
    */

    if (
        data.resultado === "vitoria"
    ) {


        titulo =
            "VITÓRIA";


        mensagem =
            "Parabéns! O Mundo foi salvo e o herói enfim descansará.";


        cor =
            "#55d66b";


        iniciarMusicaVitoria(scene);

    }


    /*
    ====================================================
                        DERROTA
    ====================================================
    */

    else if (
        data.resultado === "derrota"
    ) {


        titulo =
            "GAMER OVER";


        mensagem =
            "A Rainha destruiu o mundo que tanto almejava.";


        cor =
            "#d63143";


        iniciarMusicaGameOver(scene);

    }


    /*
    ====================================================
                        TEMPO
    ====================================================
    */

    else {


        titulo =
            "FIM DA JORNADA";


        mensagem =
            "Infelizmente a jornada do herói acabou e o mundo foi destruído...";


        cor =
            "#a4a8ad";


        iniciarMusicaGameOver(scene);

    }


    /*
    ====================================================
                        FUNDO
    ====================================================
    */

    scene.add.rectangle(

        W / 2,
        H / 2,

        W,
        H,

        0x050609

    );


    /*
        Mancha de luz.
    */

    scene.add.circle(

        W / 2,
        300,

        280,

        data.resultado === "vitoria"
            ? 0x145a25
            : 0x5a1018,

        0.18

    );


    /*
    ====================================================
                        TÍTULO
    ====================================================
    */

    scene.add.text(

        W / 2,

        225,

        titulo,

        {

            fontFamily:
                "Georgia, serif",

            fontSize:
                "58px",

            fontStyle:
                "bold",

            color:
                cor,

            stroke:
                "#000000",

            strokeThickness:
                8

        }

    )

    .setOrigin(0.5);


    /*
    ====================================================
                        MENSAGEM
    ====================================================
    */

    scene.add.text(

        W / 2,

        340,

        mensagem,

        {

            fontFamily:
                "Georgia, serif",

            fontSize:
                "27px",

            color:
                "#eeeeee",

            align:
                "center",

            wordWrap: {

                width:
                    800

            },

            lineSpacing:
                10

        }

    )

    .setOrigin(0.5);


    /*
    ====================================================
                    BOTÃO REINICIAR
    ====================================================
    */

    const botao =

        scene.add.rectangle(

            W / 2,

            485,

            270,

            70,

            0x7a1d29

        )

        .setStrokeStyle(

            2,

            0xc94b5a

        )

        .setInteractive({

            useHandCursor:
                true

        });


    scene.add.text(

        W / 2,

        485,

        "R  •  REINICIAR",

        {

            fontFamily:
                "monospace",

            fontSize:
                "22px",

            fontStyle:
                "bold",

            color:
                "#ffffff"

        }

    )

    .setOrigin(0.5);


    botao.on(

        "pointerover",

        () => {

            botao.setFillStyle(
                0xa62b3a
            );

        }

    );


    botao.on(

        "pointerout",

        () => {

            botao.setFillStyle(
                0x7a1d29
            );

        }

    );


    botao.on(

        "pointerdown",

        () => {

            iniciarAudio();

            somMenu();

            scene.scene.start(
                "MenuScene"
            );

        }

    );


    /*
        R também reinicia.
    */

    scene.input.keyboard.on(

        "keydown-R",

        () => {

            scene.scene.start(
                "MenuScene"
            );

        }

    );


    /*
        F = fullscreen.
    */

    scene.input.keyboard.on(

        "keydown-F",

        () => {

            if (
                scene.scale.isFullscreen
            ) {

                scene.scale.stopFullscreen();

            }

            else {

                scene.scale.startFullscreen();

            }

        }

    );

};
</script>
