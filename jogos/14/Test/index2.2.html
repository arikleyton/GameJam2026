// CONTROLES TOUCH
// ============================================================
(function mobileControls() {
  const isTouch = window.matchMedia("(pointer: coarse)").matches || "ontouchstart" in window;
  if (!isTouch) return;

  const css = `
    #pad-layer{position:fixed;inset:0;z-index:500;pointer-events:none;font-family:monospace}
    .pzone{position:absolute;pointer-events:auto;touch-action:none;user-select:none;-webkit-user-select:none}
    #stick{left:calc(14px + env(safe-area-inset-left,0px));
      bottom:calc(20px + env(safe-area-inset-bottom,0px));
      width:150px;height:150px;border-radius:50%;
      border:2px solid rgba(255,255,255,.25);background:rgba(0,0,0,.28)}
    #knob{position:absolute;left:50%;top:50%;width:56px;height:56px;border-radius:50%;
      background:rgba(255,255,255,.35);transform:translate(-50%,-50%);pointer-events:none}
    .pbtn{width:70px;height:70px;border-radius:50%;
      background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.35);color:#fff;
      display:flex;align-items:center;justify-content:center;font-size:10px;letter-spacing:1px}
    .pbtn.big{width:82px;height:82px;font-size:11px}
    #btnJump{right:calc(110px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.22)}
    #btnAct{right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));background:rgba(255,80,60,.35)}
    #btnPulse{right:calc(112px + env(safe-area-inset-right,0px));bottom:calc(112px + env(safe-area-inset-bottom,0px));background:rgba(255,215,0,.25)}
    #btnShield{right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(112px + env(safe-area-inset-bottom,0px));background:rgba(0,140,255,.25)}
    #btnDash{right:calc(68px + env(safe-area-inset-right,0px));bottom:calc(196px + env(safe-area-inset-bottom,0px));background:rgba(178,68,255,.28)}
  `;
  const st = document.createElement("style");
  st.textContent = css;
  document.head.appendChild(st);
  document.body.style.touchAction = "none";
  document.body.style.overscrollBehavior = "none";

  const layer = document.createElement("div");
  layer.id = "pad-layer";
  document.body.appendChild(layer);

  const down = {};
  const send = (code, isDown) => {
    if (down[code] === isDown) return;
    down[code] = isDown;
    window.dispatchEvent(new KeyboardEvent(isDown ? "keydown" : "keyup",
      { code, key: code, bubbles: true }));
  };

  const stick = document.createElement("div");
  stick.className = "pzone"; stick.id = "stick";
  stick.innerHTML = '<div id="knob"></div>';
  layer.appendChild(stick);
  const knob = stick.querySelector("#knob");
  let sid = null;

  const setStick = (e) => {
    const r = stick.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    let dx = (e.clientX - cx) / (r.width / 2);
    let dy = (e.clientY - cy) / (r.height / 2);
    const m = Math.hypot(dx, dy);
    if (m > 1) { dx /= m; dy /= m; }
    knob.style.transform = `translate(calc(-50% + ${dx * 30}%), calc(-50% + ${dy * 30}%))`;
    send("ArrowLeft",  dx < -0.3);
    send("ArrowRight", dx >  0.3);
    send("ArrowUp",    dy < -0.3);
    send("ArrowDown",  dy >  0.3);
  };
  const relStick = () => {
    sid = null;
    knob.style.transform = "translate(-50%,-50%)";
    ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].forEach((c) => send(c, false));
  };
  stick.addEventListener("pointerdown", (e) => {
    sid = e.pointerId;
    stick.setPointerCapture(sid);
    setStick(e);
    e.preventDefault();
  });
  stick.addEventListener("pointermove", (e) => { if (e.pointerId === sid) setStick(e); });
  stick.addEventListener("pointerup", relStick);
  stick.addEventListener("pointercancel", relStick);

  const mkBtn = (id, label, codes, big = false) => {
    const b = document.createElement("div");
    b.className = "pzone pbtn" + (big ? " big" : ""); b.id = id; b.textContent = label;
    layer.appendChild(b);
    b.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      codes.forEach((c) => send(c, true));
      b.style.filter = "brightness(1.8)";
    });
    const up = () => { codes.forEach((c) => send(c, false)); b.style.filter = ""; };
    b.addEventListener("pointerup", up);
    b.addEventListener("pointercancel", up);
  };
  mkBtn("btnJump", "PULO", ["KeyW"], true);
  mkBtn("btnAct", "FÚRIA", ["Space"], true);
  mkBtn("btnPulse", "LUZ", ["KeyE"]);
  mkBtn("btnShield", "ESCUDO", ["KeyQ"]);
  mkBtn("btnDash", "FENDA", ["KeyF"]);
})();

// ============================================================
// GLUE — abertura, restart, preventDefault
// ============================================================
(function shell() {
  const ss = document.getElementById("start-screen");
  const flash = document.getElementById("flash");
  const restartBtn = document.getElementById("restart");
  let started = false;

  window.__resetIntro = () => { started = false; };

  function begin() {
    if (started) return;
    started = true;
    flash.classList.add("on");
    setTimeout(() => {
      ss.classList.add("hidden");
      if (window.__startGame) window.__startGame();
    }, 250);
  }
  ss.addEventListener("pointerdown", begin);
  window.addEventListener("keydown", (e) => {
    if ((e.code === "Space" || e.code === "Enter") && !ss.classList.contains("hidden")) begin();
  });

  restartBtn.addEventListener("click", () => {
    restartBtn.blur();
    if (transitioning || currentSceneName === "title") return;
    if (paused) togglePause();
    closeDialogue(false);
    stopAudioLoops();
    go(currentSceneName);
  });

  window.addEventListener("keydown", (e) => {
    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) {
      e.preventDefault();
    }
  }, { passive: false });
})();
